[[task]]
id = "give-every-document-its-own-background-pdf-file-fixed-cache-names-collide"
title = "Give every document its own background PDF file (fixed cache names collide)"
description = "Root cause of the blanked-pages bug. Three call sites write a background PDF to a single fixed path shared by every document and both panes: XoppZip.open extracts to cacheDir/background.pdf (format/XoppZip.kt:76), MainActivity.resolvePdfBackground copies to cacheDir/background.pdf (MainActivity.kt:348), and adoptPdf copies to cacheDir/imported.pdf (MainActivity.kt:377). Pane A keeps a PdfPageCache holding a ParcelFileDescriptor open on that path; opening a PDF-backed document in pane B (or in a second tab) rewrites the bytes underneath it, so pages A has not rasterised yet come back blank while already-cached pages stay correct - exactly the reported symptom, and reloading fixes it. Fix: key the staged PDF by tab/doc id (e.g. cacheDir/pdf/<docKey>.pdf), have TabStore/OpenTab.pdfPath point at that per-document file, and delete it when the tab closes."
