[[task]]
id = "rnote-pagination-primitives-for-cutting-the-canvas-into-pages"
title = "rnote: pagination primitives for cutting the canvas into pages"
description = """
Add `app/src/main/java/com/nexopp/format/rnote/RnotePagination.kt` implementing the import-side geometry from docs/architecture.md section 'Decision (2026-08-12): canvas <-> pages, layers & backgrounds'. It works on axis-aligned bounding boxes only, so it can be written and tested before the stroke converters land.

Define `data class RnoteBounds(val minX: Double, val minY: Double, val maxX: Double, val maxY: Double)` and `data class RnotePageLayout(val pageWidth: Double, val pageHeight: Double, val pageCount: Int, val shiftX: Double, val shiftY: Double)` (page sizes in pt).

`fun pageLayout(format: RnoteFormat, contentBounds: RnoteBounds?): RnotePageLayout` — pageWidth = format.width / (4.0/3.0), pageHeight = format.height / (4.0/3.0). shiftX = -minOf(0.0, contentBounds.minX) in px, shiftY likewise; both 0.0 when contentBounds is null. pageCount = max(1, ceil((contentBounds.maxY + shiftY) / format.height)) using the px-space height, or 1 when contentBounds is null. Deliberately ignore snapshot.docX/docY/docWidth/docHeight and snapshot.layout — the doc explains why.

`fun pageIndexFor(bounds: RnoteBounds, layout: RnotePageLayout, format: RnoteFormat): Int` — floor((bounds.minY + layout.shiftY) / format.height), coerced into 0 until layout.pageCount. Never splits a stroke.

`fun pageOriginPx(pageIndex: Int, layout: RnotePageLayout, format: RnoteFormat): Pair<Double, Double>` returning the px translation to subtract from a stroke's coordinates: (layout.shiftX, layout.shiftY - pageIndex * format.height). Callers add the shift then subtract the page origin, then scale px -> pt by dividing by 4.0/3.0.

