[[task]]
id = "pdf-background-pageno-is-0-based-desktop-xournal-is-1-based-off-by-one"
title = "PDF background pageno is 0-based; desktop Xournal++ is 1-based (off-by-one)"
description = "Our XoppReader/XoppWriter and PdfImport treat the <background pageno> as 0-based (PdfImport sets pageNo=i, pdfBitmapFor calls PdfRenderer.openPage(pageNo) which is 0-based, writer emits pageNo as-is). Desktop Xournal++ writes 1-based (SaveHandler: p->getPdfPageNr()+1) and reads 1-based. Result: PDF-backed .xopp files do not round-trip faithfully cross-platform — a file saved here opens off-by-one on desktop, and a desktop file opens shifted here. Fix by converting at the file boundary: reader pageNo = pageno-1, writer pageno = pageNo+1, keep internal 0-based. Update PdfBackgroundRoundTripTest (currently asserts 0-based on-disk) and add a cross-convention test."
