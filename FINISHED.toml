[[task]]
id = "2026-07-31-fixed-xopp-saved-with-a-gz-suffix-08"
title = "Fixed: .xopp saved with a .gz suffix."
description = "The Save intent used the `application/gzip` MIME, so the Storage Access Framework appended its own `.gz` extension (`document.xopp.gz`), which desktop Xournal++ won't open by name. Switched the save MIME to `application/octet-stream` (which the framework has no canonical extension for), so SAF keeps the exact `document.xopp` name; the bytes are gzip either way (`Xopp.save` always gzips). Verified on the emulator by driving the real Save dialog: the created file is exactly `/sdcard/Download/document.xopp` (no `.gz`) with gzip magic `1f 8b`."
