id = "2026-07-30-export-the-annotated-document-as-a-flattened-pdf-15"
title = "Export the annotated document as a flattened PDF."
description = "The menu's Export PDF writes each page at its true point size via the framework `PdfDocument` (dependency-free): the background (a rasterised `pdf` page, or a solid sheet with its ruling) then every stroke and element on top, reusing `BackgroundRenderer`/`PageRenderer` at scale 1 so the output matches the editor. Extracted the shared `StrokePainter`/`PageRenderer` out of `DrawingSurfaceView` so screen and export draw identically. New JVM `PdfBackgroundRoundTripTest` (48 tests total), `BUILD SUCCESSFUL`. Verified on the `/data/android` emulator: imported a 2-page PDF, drew an X on page 1, exported, and confirmed the output PDF (via `pdftoppm`) shows the original PDF text plus the X on page 1 and clean page 2."
