[[task]]
id = "unify-the-ink-and-pdf-bitmap-caches-under-one-memory-budget"
title = "Unify the ink and PDF bitmap caches under one memory budget"
description = "There are two independent bitmap caches with unrelated eviction policies and separate budgets: InkCache (render/InkCache.kt) uses a plain HashMap keyed by page index, evicting only via retain(keep) on viewport change with a per-entry BUDGET_PX ceiling, while PdfPageCache (render/PdfPageCache.kt:57) uses an access-ordered LinkedHashMap LRU with its own byte budget. On a PDF-backed document both fill simultaneously and neither knows the other's footprint, so total bitmap memory is the sum of two guesses rather than one bound. Extract a shared BitmapBudget (bytes accounted centrally, LRU eviction, recycle on evict) that both caches allocate through, sized from the app's actual heap via ActivityManager.memoryClass instead of hard-coded constants."
status = "finished"
category = "refactor"
created = 2026-08-03
