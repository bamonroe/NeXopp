[[task]]
id = "add-a-pagerange-parser-for-export-page-selection"
title = "Add a PageRange parser for export page selection"
description = "Create app/src/main/java/com/nexopp/format/PageRange.kt with an object PageRange exposing fun parse(spec: String, pageCount: Int): List<Int>. It turns a user-typed 1-based page spec into sorted, de-duplicated ZERO-based page indices. Rules: a blank/whitespace-only spec means all pages (0 until pageCount); comma-separated tokens; a token may be a single number (\"5\") or a range (\"1-3\"); an open-ended range (\"8-\") runs to the last page; whitespace around tokens is trimmed; numbers outside 1..pageCount are clamped away (dropped, not an error); a reversed range (\"5-2\") is read as 2-5; a token that is not numeric is ignored. Never throw — a fully unparseable spec returns an empty list, and the caller decides what to do. Add KDoc in the house style (explain WHY zero-based indices are returned: the Document model indexes pages from 0). Add app/src/test/java/com/nexopp/format/PageRangeTest.kt covering: blank spec, single page, comma list, range, open-ended range, reversed range, out-of-bounds clamping, duplicates collapsing, garbage input. Verify with scripts/build.sh testDebugUnitTest."
