[[task]]
id = "2026-07-31-selection-tool-to-desktop-parity-06"
title = "Selection tool to desktop parity."
description = "Extended the object-selection tool from rectangle-select + move + delete to the full desktop feature set, all as pure, JVM-tested `SelectionOps`/`SelectionTester` ops so the logic stays off the Android surface: (1) resize via four corner handles (uniform scale about the opposite corner, `SelectionOps.scale`, backed by a single `affine` primitive); (2) rotate via a top knob (`SelectionOps.rotate`) — *stroke only by the scope rule*, since a stroke bakes rotation into its vertex coordinates and round-trips but text/images have no rotation attribute in `.xopp`, so the knob is shown only for an all-stroke selection; (3) lasso (free-form) select alongside the rectangle (`SelectionTester.inPolygon`, wholly-enclosed semantics); (4) cut / copy / paste / duplicate through a view-held element clipboard (`elementsAt` + `addToTopLayer`, which reports the pasted refs so copies land selected; paste targets the visible page); (5) move across pages — dropping a move over another page re-homes the elements through both pages' pt frames (`SelectionOps.moveToPage`); and (6) recolour / re-width the selection (`SelectionOps.restyle`). New UI: a scrollable selection action bar (cut/copy/duplicate/palette/line-weight/delete/done) and a select-mode bar (Rectangle/Lasso chips + Paste). Tilt/orientation was dropped from the roadmap and a \"the format is the boundary\" scope rule recorded (`CLAUDE.md`) — we only build features `.xopp` can represent. Extended `SelectionTest` (resize/rotate/restyle/clipboard/ moveToPage/lasso) plus a new instrumented `SelectionInputTest` (synthetic finger gestures for lasso, copy/paste, cross-page move). `BUILD SUCCESSFUL`; all JVM unit tests + all 9 instrumented tests pass on the `/data/android` emulator, where select → resize/rotate handles, lasso, copy/paste and recolour were also confirmed live via screenshots with a clean logcat. Installed to the Tab S9 Ultra; the Pixel 8a was offline (install deferred)."
status = "finished"
category = "feature"
completed = 2026-07-31

[[task]]
id = "2026-07-31-stylus-first-input-layer-07"
title = "Stylus-first input layer."
description = "Routed `DrawingSurfaceView.onTouchEvent` through a new pure, JVM-tested `InputClassifier` (`PointerKind` + barrel state + `ActiveTool` + `InputSettings` → `GestureIntent`), so pen hardware wins over the toolbar the way desktop Xournal++ does: (1) the flipped-over eraser tip (`TOOL_TYPE_ERASER`) erases whatever the tool; (2) the barrel button (`BUTTON_STYLUS_PRIMARY`) does a configurable action while held (default erase, or select); (3) palm rejection — the gesture is owned by a pointer id and only that pointer is sampled, a stylus takes over a gesture a resting finger/palm started, and once a stylus owns the stroke extra finger/palm pointers are ignored; (4) a Settings \"finger draws\" toggle makes fingers pan-only for non-stylus-safe writing; (5) a configurable pressure curve (`PressureCurve`, Soft/Linear/Firm — Linear reproduces the old `0.4+0.6·pressure` exactly) replacing the hard-coded response; and (6) a hover preview ring from `ACTION_HOVER_MOVE`. New pure pieces `InputClassifier` + `PressureCurve` with JVM tests (`InputClassifierTest`, `PressureCurveTest`), a real Settings screen (`AppSettings` + `SettingsStore` SharedPreferences persistence, wired through `EditorScreen`/`MainActivity`), and on-device `StylusInputTest` (eraser tip, barrel erase, finger-draw gate, palm rejection — driven with synthetic tool-typed `MotionEvent`s). `BUILD SUCCESSFUL`; all JVM unit tests + all 6 instrumented tests pass on the `/data/android` emulator. Verified on-device: Settings screen renders and its toggles persist across a force-stop/relaunch, finger drawing still works (no regression from the touch rewrite), and the finger-draw toggle changes behaviour. Only tilt-driven width remains (see TODO Active — no format home). Installed to the Galaxy Tab S9 Ultra (SM-X920, S-Pen — the ideal target); the Pixel 8a was offline on the tailnet at install time (catch it up on the next build)."
status = "finished"
category = "feature"
completed = 2026-07-31

[[task]]
id = "2026-07-31-fixed-xopp-saved-with-a-gz-suffix-08"
title = "Fixed: .xopp saved with a .gz suffix."
description = "The Save intent used the `application/gzip` MIME, so the Storage Access Framework appended its own `.gz` extension (`document.xopp.gz`), which desktop Xournal++ won't open by name. Switched the save MIME to `application/octet-stream` (which the framework has no canonical extension for), so SAF keeps the exact `document.xopp` name; the bytes are gzip either way (`Xopp.save` always gzips). Verified on the emulator by driving the real Save dialog: the created file is exactly `/sdcard/Download/document.xopp` (no `.gz`) with gzip magic `1f 8b`."
status = "finished"
category = "bug"
completed = 2026-07-31

