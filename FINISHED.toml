id = "2026-07-31-render-teximage-as-real-math-latex-renderer-12"
title = "Render teximage as real math (LaTeX renderer)."
description = "New dependency-free `LatexParser` (pure, `LatexNode` tree — rows, sub/superscripts, `\\frac`, `\\sqrt`, grouping, Greek/operator Unicode; never throws) + `LatexRenderer` (measures then scales to fit the box, draws fraction bars / scripts / roots), replacing the source-text placeholder in `ElementRenderer.drawTex` (parse cached by element identity, fallback to monospace source on error). 12 new JVM `LatexParserTest` cases. Verified on the `/data/android` emulator: `\\frac{a}{b}+x^2` renders as a real fraction with a superscript. Installed to both tailnet devices."
status = "finished"
category = "feature"
completed = 2026-07-31

