[[task]]
id = "2026-07-31-selection-tool-rectangle-tap-select-move-delete-09"
title = "Selection tool (rectangle + tap select, move, delete)."
description = "New Select tool on the rail (`EditorTool.SELECT` → the surface's `selectMode`) matching desktop Xournal++: a one-finger drag rubber-bands and selects every object wholly enclosed; a tap picks the topmost object; dragging inside the dashed outline moves the selection (live, undoable); a floating Delete / Deselect bar (`SelectionActionBar`) removes or clears it. Selection is per-page and addresses elements by position (`ElementRef`), stable across a drag. New pure, JVM-tested pieces: `ElementBounds` (+ `Bounds`), `SelectionTester` (rect/tap/union), `SelectionOps` (translate/ delete) — 2 new test files, `BUILD SUCCESSFUL`. Documented the mechanics and a stylus & selection roadmap in `docs/architecture.md` (+ README \"Select\"). Verified on the `/data/android` emulator: drew two strokes, band-selected one (outline wraps it, the other untouched, Delete/Deselect bar appears), dragged it to a new spot, Deleted it (gone), Undo restored it at the moved position, and tap-selected a single stroke. Caught and fixed a bug on-device where the rubber-band marquee persisted after release (`commitBand` rendered before the `banding` flag was cleared). Installed to the Galaxy Tab S9 Ultra; the Pixel 8a was offline on the tailnet at install time (catch it up on the next build)."
status = "finished"
category = "feature"
completed = 2026-07-31

