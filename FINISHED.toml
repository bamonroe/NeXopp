description = "The text tool now opens a styled dialog instead of a bare content field: pick a font family (Sans / Serif / Monospace), toggle bold/italic, set a size (6–96 pt slider), and choose the box's own colour (its own swatch row, decoupled from the pen colour). Bold/italic encode into the `.xopp` `<text font>` value as Pango tokens (`Sans Bold Italic`) via the pure, JVM-tested `format/FontDescription.kt` (parse/compose are exact inverses); the renderer parses that back to a `Typeface` style and maps the family to an Android typeface, so styling round-trips to and from desktop Xournal++. Editing an existing box prefills every control from the element (`Placement` now carries the whole `TextElement`). Emulator-verified end-to-end: styled placement renders red bold-italic 38 pt and reopens with all controls prefilled. Underline is intentionally excluded — a Pango font description can't store it, so it can't round-trip (format-is-the-boundary rule)."
