[[task]]
id = "stage-remote-opens-to-unique-temp-files-open-tmp-is-shared"
title = "Stage remote opens to unique temp files (open.tmp is shared)"
description = "Likely root cause of the tabs-overwriting-each-other bug. UriStaging.newFile builds a fixed path '<name>.tmp' (io/UriStaging.kt:45), so every open uses cacheDir/staging/open.tmp. MainActivity.openDocument runs stageIn on a background thread (inBackground, MainActivity.kt:254); over a slow remote provider two opens overlap and the second download overwrites the first's bytes before or while it is parsed, so both tabs end up loading the same document. Fix: make newFile unique per call (counter or tab id) and delete it after the load; consider serialising opens or cancelling a superseded one."
