[[task]]
id = "2026-07-30-import-a-pdf-as-an-annotatable-document-pdf-page-backgrounds-16"
title = "Import a PDF as an annotatable document (PDF page backgrounds)."
description = "The menu's Import PDF copies the picked PDF into app cache and builds a document with one page per PDF page; each page carries a `<background type=\"pdf\">` (filename+domain on page 1 only, `pageno` thereafter — the desktop convention). Pages are rasterised on demand by the framework `PdfRenderer` (dependency-free) in the new `PdfPageCache` (serialised, bounded bitmap cache), and `BackgroundRenderer` draws the page image; a `.xopp` whose PDF isn't present falls back to a plain sheet. `BUILD SUCCESSFUL`, 40 tests pass. Verified on the `/data/android` emulator: imported a 2-page PDF (both pages rendered with their text/border), drew an X over page 1 (Undo lit), no crash. Export to PDF is the remaining half — see Active."
status = "finished"
category = "feature"
completed = 2026-07-30

