id = "2026-07-30-fixed-drawing-wiped-when-visiting-settings-18"
title = "Fixed: drawing wiped when visiting Settings."
description = "Opening Settings early-`return`ed from `EditorScreen`, tearing the `AndroidView`-hosted `DrawingSurfaceView` out of the composition; since strokes lived only in that view, coming back rebuilt a blank one. Settings now renders as an opaque overlay in a `Box` on top of the still-composed editor, so the surface is never detached — the drawing and undo history survive the round trip. `BUILD SUCCESSFUL`, 40 tests pass. Verified on the `/data/android` emulator: drew two strokes, entered Settings (canvas fully covered, no bleed-through), backed out — both strokes and the lit Undo button remained, no crash. Installed to both tailnet devices."
status = "finished"
category = "bug"
completed = 2026-07-30

