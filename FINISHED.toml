[[task]]
id = "2026-07-30-fixed-drawing-wiped-when-visiting-settings-18"
title = "Fixed: drawing wiped when visiting Settings."
description = "Opening Settings early-`return`ed from `EditorScreen`, tearing the `AndroidView`-hosted `DrawingSurfaceView` out of the composition; since strokes lived only in that view, coming back rebuilt a blank one. Settings now renders as an opaque overlay in a `Box` on top of the still-composed editor, so the surface is never detached — the drawing and undo history survive the round trip. `BUILD SUCCESSFUL`, 40 tests pass. Verified on the `/data/android` emulator: drew two strokes, entered Settings (canvas fully covered, no bleed-through), backed out — both strokes and the lit Undo button remained, no crash. Installed to both tailnet devices."
status = "finished"
category = "bug"
completed = 2026-07-30

[[task]]
id = "2026-07-30-hand-tool-zoom-and-add-remove-page-19"
title = "Hand tool, zoom, and add/remove page."
description = "The Tool pop-up gained a Hand mode (one-finger pan; two-finger pan works in every tool). A Zoom button opens a −/+/reset pop-up; zoom multiplies the fit-to-width scale in `PageStacker`, pages wider than the view pan horizontally, narrower pages centre (`PageBox.leftPx`). A Pages button adds a blank page (inheriting the current page's size/background, via the pure `PageOps`) or removes the page in view (never the last one), showing the page count; both are undoable. New pure tests for `PageOps` and `PageStacker` zoom/centering. `BUILD SUCCESSFUL`, all tests pass. Verified on the `/data/android` emulator: added a page (count 1→2, page break visible, Undo lit), zoomed to 156% (grid enlarged, live label), Hand-panned to the page break, removed a page (2→1), no crash. Installed to both tailnet devices."
status = "finished"
category = "feature"
completed = 2026-07-30

