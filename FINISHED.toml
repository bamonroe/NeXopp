[[task]]
id = "2026-07-31-resize-orientation-data-loss-fixed-the-loaded-document-survives-rotate-split-screen-resize-01"
title = "Resize/orientation data loss fixed — the loaded document survives rotate & split-screen resize."
description = "The parsed `.xopp` `Document` lives only in `DrawingSurfaceView.doc` (an imperatively-created `SurfaceView` reached via a plain `remember{}` handle, with no ViewModel/`rememberSaveable`/`onSaveInstanceState`). Previously a phone rotation or split-screen resize triggered Activity recreation: `onCreate` re-ran, the `AndroidView` factory built a fresh `DrawingSurfaceView` whose `doc` defaults to a single blank page, and the loaded document — held only by the now-destroyed old view — was gone, so the canvas came back blank. Fix: add `android:configChanges=\"orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize\"` to the `MainActivity` entry in `AndroidManifest.xml`, so Android keeps the same Activity, composition, and `DrawingSurfaceView` instance across those config changes instead of recreating it. On resize the existing `surfaceChanged` just re-runs `relayout(); render()`, re-stacking the same `doc.pages` to the new width — document and undo history retained. Emulator-verified: loaded a multi-page document, rotated portrait↔landscape and entered split-screen, and the strokes/pages survived intact."
status = "finished"
category = "bug"
completed = 2026-07-31

[[task]]
id = "2026-07-31-right-edge-pdf-style-scroll-thumb-for-fast-paging-02"
title = "Right-edge PDF-style scroll thumb for fast paging."
description = "A draggable scroll thumb (`ScrollThumb.kt`, overlaid on the canvas as a `Box` sibling of the `AndroidView`) rides the right edge whenever the document is taller than the screen. The surface reports its vertical scroll geometry via `onScrollChanged(scrollY, totalHeightPx, viewportPx)` (content px, zoom-scaled); the thumb sizes and positions itself from that ratio and dragging it drives `DrawingSurfaceView.scrollToY` for fast paging through long documents. The touch target is only the thumb *band*, not the whole right edge, so a stylus can still ink the page's right margin everywhere but the thumb. It sits faint when idle, brightens after a scroll, is brightest while dragged, and shows a page-number bubble beside it during a drag. A pure navigation affordance — no `.xopp` state, so nothing round-trips. Emulator-verified end-to-end: dragged the thumb up and down a 5-page graph-paper document and watched the page stack scroll with the \"N / 5\" bubble tracking the thumb."
status = "finished"
category = "feature"
completed = 2026-07-31

