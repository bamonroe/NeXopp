description = """
Gap found while building the feature-gap matrix: there is NO task anywhere for actually serialising a Document to .rnote. The existing items cover the geometry ('rnote: lay fixed pages back onto the canvas on export', which explicitly says 'the JSON serialisation itself is a later task'), the warnings, and the routing ('Route saving to the rnote writer when SaveFormat is RNOTE', which is blocked on a writer that does not exist). The writer itself is missing.

