# Containerized build/test. `docker compose run --rm build` runs the default check loop;
# pass Gradle tasks to override, e.g. `docker compose run --rm build ./gradlew assembleDebug`.
# Works with `podman compose` too.
services:
  build:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    command: ["./gradlew", "--no-daemon", "testDebugUnitTest", "assembleDebug"]

volumes:
  gradle-cache:
