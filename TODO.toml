In textStrokeToText() in app/src/main/java/com/nexopp/format/rnote/RnoteStrokeConvert.kt, run flattenRuns() over text_style.ranged_text_attributes with the UTF-8 byte length of the text, then for each of font_family, font_size, font_weight, font_style and text_color call uniformAttribute(); when it returns a value, that value OVERRIDES the base text_style value used to build the TextElement. When it returns null, keep the base text_style value and drop the rest. underline and strikethrough are always dropped - the Pango description has no token for them.

