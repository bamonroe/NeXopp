[[task]]
id = "show-the-rnote-lossy-save-warnings-in-the-save-flow"
title = "Show the .rnote lossy-save warnings in the save flow"
description = """
The plumbing half of docs/architecture.md 'Decision (2026-08-12): no per-tab document mode — the editor stays uniform, the save path warns'. The editor gains NO mode and NO per-tab state beyond OpenTab.format; this task is only the reporting. Blocked until exportWarnings() exists (task 'rnote: warn on save when a document's pages or backgrounds cannot survive .rnote').

Two behaviours, both driven by RnoteExportWarnings.exportWarnings(document):

1. Save As, in app/src/main/java/com/nexopp/ui/EditorDialogs.kt / the save-as flow in MainActivityDocuments.kt: when the chosen SaveFormat is RNOTE and exportWarnings is non-empty, show a modal AlertDialog BEFORE writing — title 'Some content will not be saved', the warning lines as body text, buttons 'Cancel' and 'Save as Rnote'. Cancel writes nothing and leaves the tab's format untouched. Confirm proceeds with the existing write and the existing format-stickiness switch.
2. A plain Save of a tab whose format is already RNOTE: write immediately, then show a snackbar 'Some content was not saved' with a 'Details' action that opens the same list in a read-only dialog. No modal — the user already chose this format.

An EMPTY warning list must show nothing in either path: no dialog, no snackbar. Do not add a 'nothing will be lost' confirmation.

Do not compute warning text in the UI — every string comes from exportWarnings, which stays pure.

Also per that decision: the tab strip gets NO format badge. Do not add one; the tab title is the file name and already carries the extension.

Verify: scripts/build.sh, then the emulator pass — open fixtures/backgrounds.xopp, Save As with Rnote selected, screenshot the warning dialog, cancel and confirm the file was not written; then confirm and screenshot; then plain-Save the now-.rnote tab and screenshot the snackbar. Check adb logcat for exceptions."""
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 440
created = 2026-08-12
tags = []
rebuild = false
emulator_debug = true

[[task]]
id = "break-down-the-rnote-writer-json-emission-and-element-encoders"
title = "Break down the .rnote writer: JSON emission and element encoders"
description = """
Gap found while building the feature-gap matrix: there is NO task anywhere for actually serialising a Document to .rnote. The existing items cover the geometry ('rnote: lay fixed pages back onto the canvas on export', which explicitly says 'the JSON serialisation itself is a later task'), the warnings, and the routing ('Route saving to the rnote writer when SaveFormat is RNOTE', which is blocked on a writer that does not exist). The writer itself is missing.

Investigate and add the atomic tasks for:
- A JSON WRITER beside the existing reader in app/src/main/java/com/nexopp/format/json/ — the reader parses to JsonValue; check whether a JsonValue -> compact-string emitter exists yet and add a task if not. Rnote writes with serde_json and no whitespace.
- The CONTAINER writer mirroring RnoteContainer.kt: gzip the UTF-8 JSON, wrap it as {"version":"0.14.2","data":{"engine_snapshot":{...}}}.
- The SNAPSHOT assembler: document.config.format/background/layout, document x/y/width/height from canvasExtent, stroke_components as {"value":<stroke>,"version":n} slots with a leading null at index 0, the parallel chrono_components, and chrono_counter = max(t) + 1.
- One ELEMENT ENCODER per kind, each its own task: Stroke -> brushstroke (smooth style, pressure_curve "linear", the line_style and line_cap mappings), TextElement -> textstroke, ImageElement -> bitmapimage, and TexImageElement -> a bitmapimage of its rendered PNG.

Every per-feature verdict the encoders must honour is already decided and written down — read docs/architecture.md, 'The complete .xopp <-> .rnote feature-gap matrix', and do not re-decide any of it here. Two rows are load-bearing and easy to miss:
- pressure_curve must be written as "linear": it is upstream's default AND the identity, so widths are not re-curved on reopen.
- bitmapimage needs the INVERSE of RawImageCodec — encoded PNG/JPEG bytes back to a raw premultiplied RGBA buffer. RawImageCodec deliberately avoids android.graphics.Bitmap because it is a throwing stub under JVM unit tests, so the decoder has the same constraint. Scope how a JPEG is handled; this may be the hardest single item.

Output is TODO items, not code. Close this scope once they exist."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 450
created = 2026-08-12
tags = []
rebuild = false
emulator_debug = false
