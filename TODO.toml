[[task]]
id = "clamp-settings-on-load"
title = "Clamp pen widths, last width and page columns at settings load"
description = "ui/AppSettings.kt SettingsStore.load: penWidths (~line 238) and lastWidth (~line 249) come out of SharedPreferences unclamped, but ui/RadialPalette.kt:48 has require(widthPt in PEN_WIDTH_MIN..PEN_WIDTH_MAX) — a corrupt or legacy pref value crashes the app when it reaches a palette slot. Every other consumer clamps: ToolPresetCodec.kt:55, RadialPaletteCodec.kt:104, ToolbarSizePopup.kt:156, PaletteActionPicker.kt:126. pageColumns (~line 240) is also unclamped: DrawingSurfaceView.setColumns clamps to 1..PageStacker.COLUMN_CHOICES.last() but EditorScreen.kt:89 and ToolbarPagesPopup.kt:345/352 use the raw value, so a stored 0 makes the popup mode rows unreachable. Fix in SettingsStore.load, following the fillAlpha pattern at ~line 250: coerce each penWidths entry and lastWidth into PEN_WIDTH_MIN..PEN_WIDTH_MAX, and pageColumns into 1..PageStacker.COLUMN_CHOICES.last(). Unit-test load with out-of-range prefs."
