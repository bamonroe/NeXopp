[[task]]
id = "wrap-and-paginate-text-from-a-streaming-reader"
title = "Wrap and paginate text from a streaming reader"
description = "TextPaginator.wrap/paginate build a full List<String> of every wrapped line and then chunk it (TextPaginator.kt:61,106), so memory scales with the file. Add a streaming API alongside the existing one: take a Reader (or Sequence<String> of raw lines) and emit Sequence<List<String>> of pages, wrapping line-by-line and yielding a page as soon as linesPerPage is reached. Keep the current List-based layout() as a thin wrapper over it so existing TextPaginatorTest cases still pass, and add tests that a page is emitted before the whole input is consumed."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 180
created = 2026-08-04
