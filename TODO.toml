title = "Check upstream Xournal++ for the mimetype fix behind XoppZip hack"
description = "format/XoppZip.kt:24-37: MIMETYPE = \"application/x-xopp-zip\" is a documented deliberate workaround for the inverted mimetype check in Xournal++ 1.3.5, with no expiry condition. Check current upstream (github.com/xournalpp/xournalpp release notes or source) for whether the inverted check is fixed. If fixed: flip the constant back to \"application/xournal++\", set this task rebuild=true before working it, run the round-trip tests, and ideally verify a file opens in a current desktop build. If not fixed: add a version-gated note in the KDoc naming the upstream issue and the last-checked version so the next check is mechanical."
