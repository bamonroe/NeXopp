# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "write-the-text-import-pdf-one-page-chunk-at-a-time"
title = "Write the text-import PDF one page chunk at a time"
description = "TextPdfGenerator.generate builds a single PDDocument holding every PDPage and only writes at doc.save (TextPdfGenerator.kt:26-33). PDFBox 2.x cannot append pages to an already-written file, so build the PDF in bounded chunks: for each N pages create a PDDocument, writePage into it, save to a temp file, close it, then merge the chunk files with the existing render/PdfMerger.kt into the output stream. Depends on the streaming paginator task. Verify with TextPdfGeneratorTest that page count, text extraction and the embedded non-Latin1 font all still round-trip."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 190
created = 2026-08-04
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "key-the-text-import-cache-by-a-streamed-file-hash"
title = "Key the text import cache by a streamed file hash"
description = "TextImport.pdfFor does staged.readText() to hold the whole file as a String, both for the SHA-256 cache key and to hand to the generator (TextImport.kt:37-50). Compute the key by streaming the file through a DigestInputStream (name + bytes) instead, and pass the staged File to the generator rather than a String, so nothing above one page is resident. Keep the existing cache-hit/miss semantics covered by TextImportTest."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 200
created = 2026-08-04
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "raise-the-text-import-cap-now-that-typesetting-is-bounded"
title = "Raise the text import cap now that typesetting is bounded"
description = "Once the import path is streaming end to end, the hard cap in TextImport.pdfFor exists only to bound output size and time, not memory. Re-measure peak memory on a large file, then raise AppSettings.TEXT_IMPORT_LIMIT_CHOICES / DEFAULT_TEXT_IMPORT_LIMIT_MB (AppSettings.kt:177,183) to the new safe ceiling and update the Storage section copy in README.md accordingly. Depends on the three streaming tasks."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 210
created = 2026-08-04
tags = []
rebuild = true
emulator_debug = true
