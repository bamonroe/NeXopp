[[task]]
id = "radial-palette-hit-test-angle-and-radius-to-a-slot"
title = "Radial palette: hit-test angle and radius to a slot"
description = "Given the palette anchor point and a pointer position, map (angle, radius) to a slot: dead zone at the centre = cancel, inner annulus = one of 8, outer annulus = one of 16, beyond outer radius = clamp to outer. Angles start at 12 o'clock and go clockwise. Pure function next to the data model, fully unit-tested (boundaries, wraparound at 0/360, empty slots)."
