# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "split-pane-same-document-in-both-panes-with-color-coded-tab-dots"
title = "Split pane: same document in both panes, with color-coded tab dots"
description = "Allow the same document to be opened in both split panes as two independent views (different scroll/zoom positions) on one shared document model. Annotations or edits made in one pane must immediately reflect in the other pane — a single shared document/state object, not two loaded copies. Since documents now have names and many names can be identical, add a color-coded indicator (e.g. a small colored dot in the tab, or tinted tab) that marks which tabs are in fact the same underlying document open in more than one tab, so duplicates are visually distinguishable from same-named-but-different files."
status = "active"
category = "feature"
urgency = "normal"
order = 10
created = 2026-08-03
tags = ["split-view", "tabs", "ui"]
rebuild = true
emulator_debug = true

[[task]]
id = "drag-a-tab-to-reorder-it-within-its-pane"
title = "Drag a tab to reorder it within its pane"
description = "Holding a tab and dragging it sideways should move it within its own tab strip, reordering the open documents. Needs a move(from,to) on TabManager plus a drag-reorder gesture in TabStrip that coexists with the existing long-press menu (move/mirror to the other view). Secondary to that menu."
status = "active"
category = "feature"
urgency = "low"
order = 20
created = 2026-08-03
tags = ["tabs"]
rebuild = true
emulator_debug = false

[[task]]
id = "live-two-way-mirroring-of-a-document-across-split-panes"
title = "Live two-way mirroring of a document across split panes"
description = "Today 'Mirror on other view' copies the document into the other pane as a snapshot; the two sides then edit independently. A true mirror would share one document between both canvases so strokes appear on both sides at once (and both scroll/zoom independently). Needs a shared document model rather than one document per pane."
status = "active"
category = "feature"
urgency = "low"
order = 30
created = 2026-08-03
tags = ["tabs", "split-view"]
rebuild = true
emulator_debug = false
