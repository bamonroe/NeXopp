[[task]]
id = "eraser-does-not-respond-to-synthetic-touch-on-the-emulator"
title = "Eraser does not respond to synthetic touch on the emulator"
description = "With the partial eraser selected, adb 'input swipe' across ink (freehand or shape) erases nothing on the emulator, while the pen and shape tools draw fine with the same synthetic touch. Either the eraser gesture is gated somewhere for non-stylus/UNKNOWN tool-type pointers, or the tip radius is too small to catch batched move samples. Blocks emulator verification of eraser changes."
status = "active"
level = "task"
category = "bug"
urgency = "high"
order = 40
