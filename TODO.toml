[[task]]
id = "rnote-encode-bitmapimage"
title = "Encode an ImageElement or TexImageElement as an rnote bitmapimage"
description = """
The export mirror of bitmapImageToImage in RnoteStrokeConvert.kt. Add to app/src/main/java/com/nexopp/format/rnote/RnoteStrokeEncode.kt:

'fun imageToBitmapImage(image: ImageElement): JsonValue?' and 'fun texImageToBitmapImage(tex: TexImageElement): JsonValue?', both null when the pixels cannot be decoded (see below). Shape, matching the text-image.rnote fixture exactly:

{"image":{"data":<base64 raw RGBA>,"rectangle":{"cuboid":{"half_extents":[pw/2,ph/2]},"transform":{"affine":[1,0,0,-0,1,0,pw/2,ph/2,1]}},"pixel_width":pw,"pixel_height":ph,"memory_format":"R8g8b8a8Premultiplied"},"rectangle":{"cuboid":{"half_extents":[hx,hy]},"transform":{"affine":[1,0,0,-0,1,0,cx,cy,1]}}}

- The INNER rectangle is in pixel space: half extents pixel_width/2 and pixel_height/2, centred on itself.
- The OUTER rectangle is the placement in canvas px: cx = ptToPx((left+right)/2), cy = ptToPx((top+bottom)/2), hx = ptToPx((right-left)/2), hy = ptToPx((bottom-top)/2). Reuse affineOf() from the brushstroke/textstroke task.
- Pixels: RawImageCodec.decodeToRaw(element.data) -> premultiply -> Base64.getEncoder().encodeToString (no line breaks; the reader uses the MIME decoder so either works, but serde writes one line).
- A TexImageElement encodes its rendered PNG (TexImageElement.data); a null data or an undecodable buffer returns null so the caller can skip and report it. The LaTeX source is lost either way - exportWarnings already says so.
- Return null rather than throwing: one unreadable image must not sink the save.

Test in RnoteStrokeEncodeTest.kt: build an ImageElement from RawImageCodec.encodePng of a known 2x2 buffer, encode it, feed the result back through bitmapImageToImage and assert the pt box and the pixels survive; assert a TexImageElement with null data encodes to null; assert a JPEG-headered ImageElement encodes to null.

Verify: scripts/build.sh testDebugUnitTest"""
