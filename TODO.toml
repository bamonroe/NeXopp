[[task]]
id = "rnote-assemble-a-document-from-the-snapshot"
title = "rnote: assemble a Document from the snapshot"
description = """
The assembler that ties the .rnote import together. Depends on the pagination, layer-stack and background tasks plus the per-stroke converters (brushstroke/textstroke/bitmapimage/shapestroke). Add `app/src/main/java/com/nexopp/format/rnote/RnoteDocumentReader.kt`.

`fun readDocument(snapshot: RnoteSnapshot): RnoteImport` where `data class RnoteImport(val document: Document, val skipped: List<String>)` — skipped is the skip-and-report list from the sibling task.

Algorithm, per docs/architecture.md 'Decision (2026-08-12): canvas <-> pages, layers & backgrounds':
1. Convert each RnoteStroke to an Element with the per-kind converters, keeping its px bounding box; unconvertible kinds go to skipped.
2. Union the bounding boxes into an RnoteBounds; call pageLayout(snapshot.format, bounds).
3. Call layerSlots(snapshot.strokes) for the stack; every page gets the same stack, in the same order, empty layers included, with Layer.name set to the slot name.
4. For each element: pageIndex = pageIndexFor(its bounds, layout, format); translate by pageOriginPx then scale px -> pt (divide by 4.0/3.0); append to that page's layer for its slot. Strokes are already sorted by chrono t then slot index by RnoteSnapshot.parse, so appending preserves painters order.
5. Build Page(width = layout.pageWidth, height = layout.pageHeight, background = toXoppBackground(snapshot.background), layers = the stack) for each of layout.pageCount pages, and Document(creator = "NeXopp", pages = those).

Verify with `app/src/test/java/com/nexopp/format/rnote/RnoteDocumentReaderTest.kt` against the fixtures and their .xopp twins in app/src/test/resources/fixtures/: backgrounds.rnote gives 5 pages of 595.28 x 841.89 pt with one stroke each, each stroke's first point near (30, 30) pt; layers.rnote gives 1 page with layers ["highlighter", "user_layer 0"] holding 1 and 2 elements; text-image.rnote gives 1 page whose "image" layer holds the ImageElement and whose "user_layer 0" holds the TextElement; empty.rnote gives exactly 1 page with a dotted background and no elements. Run scripts/build.sh testDebugUnitTest."""
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 270
created = 2026-08-12
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "rnote-lay-fixed-pages-back-onto-the-canvas-on-export"
title = "rnote: lay fixed pages back onto the canvas on export"
description = """
The export-side geometry, mirroring the import assembler. Add `app/src/main/java/com/nexopp/format/rnote/RnoteDocumentWriterGeometry.kt` (the JSON serialisation itself is a later task; this one is pure geometry and slot assignment, unit-testable on its own).

Per docs/architecture.md 'Decision (2026-08-12): canvas <-> pages, layers & backgrounds':

`fun canvasFormat(document: Document): RnoteFormat` — from page 1: width = page.width * (4.0/3.0), height = page.height * (4.0/3.0), dpi = 96.0, orientation = if (page.width <= page.height) "portrait" else "landscape". Empty document: A4, 793.701 x 1122.52.

`fun pageOriginsPx(document: Document): List<Double>` — cumulative y offsets in px: page 0 at 0.0, page i at the sum of preceding page heights * (4.0/3.0). For uniform pages this equals i * format.height.

`fun canvasExtent(document: Document): RnoteBounds` — x = 0.0, y = 0.0, maxX = widest page * (4.0/3.0), maxY = sum of page heights * (4.0/3.0). The writer emits layout "fixed_size" (NOT "infinite"), so Rnote draws page boundaries where we do.

`fun slotFor(element: Element, layer: Layer, layerIndex: Int): Pair<String, Int?>` returning (layer name, userLayer index) — in order: a Stroke with Tool.HIGHLIGHTER -> ("highlighter", null); an ImageElement -> ("image", null); a Layer.name that is exactly "document", "image", "highlighter" or "user_layer <n>" -> that slot; otherwise ("user_layer", layerIndex).

`fun hasMixedPageSizes(document: Document): Boolean` — true when any page differs from page 1 in width or height. The save path uses this to warn that re-import will re-page the document wrongly.

Verify with `app/src/test/java/com/nexopp/format/rnote/RnoteDocumentWriterGeometryTest.kt`: load `fixtures/backgrounds.xopp` through the existing .xopp reader and assert canvasFormat is 793.701 x 1122.52 within 0.01 and pageOriginsPx is [0, 1122.52, 2245.04, 3367.56, 4490.08] within 0.01 — the same stacking rnote-cli produced; assert hasMixedPageSizes is false for it; assert slotFor puts a highlighter stroke on "highlighter" and an image on "image" regardless of its layer. Run scripts/build.sh testDebugUnitTest."""
