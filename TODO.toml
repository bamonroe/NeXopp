#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "open-arbitrary-text-files-as-a-paginated-pdf-backed-document"
title = "Open arbitrary text files as a paginated PDF-backed document"
description = """
Let the app accept a plain-text file (VIEW/EDIT intent or picker) and convert it on the fly into a PDF that becomes the page background, so it opens exactly like any other PDF-backed tab and can be annotated and saved as .xopp.

Investigate and break down into atomic tasks; the shape looks like:
- Sniffing: extend format/FileKind.kt to recognise text (and probably markdown/source) alongside PDF/XML/ZIP, and add text/plain intent filters in AndroidManifest.xml plus a branch in MainActivity/io/DocumentIo.kt next to LoadedFile.Pdf.
- Pagination: a new layout unit that wraps the text into lines and paginates it against the default paper size from the user's default page settings, white background. Fonts come from format/FontDescription.kt; line layout logic overlaps render/TextBlock.kt and may be shareable.
- PDF generation: emit a real PDF with PDFBox using embedded, selectable text (no rasterising and no OCR - the characters are already known). Reuse the vector text path in render/PdfVectorPainter.kt where it fits.
- Wiring: hand the generated PDF to PdfStore/PdfImport so it lands as Background.Pdf like a normal import; text selection then falls out of PdfTextExtractor/PdfText for free.

RESOLVED open questions (2026-08-04):
- Persistence: the generated PDF lives in the app cache via the existing io/PdfStore.kt, which is already one-file-per-document and prunes against the tabs still open - so closing the tab drops it, and clearing app cache through Android drops it too. Extend it with a small manifest keyed by a content hash of the source text (plus title), so reopening the same file while its cache entry survives reuses the PDF instead of regenerating. On save to .xopp the generated PDF must be attached/zipped (ZIPPED/attach encode path in DocumentIo.kt) since there is no source PDF on disk.
- Fonts: ship a permissively licensed open-source family (no license encumbrance), one proportional and one monospace; monospace is the sensible default for logs and source. Unicode coverage is settled by that same font choice - pick one with broad coverage and document the fallback for characters it lacks.
- Very large files: cap it. Generate lazily / incrementally rather than converting a whole several-hundred-megabyte log up front, and enforce a per-file cache size cap with a clear message when a file exceeds it. Expose the cap as an Advanced setting.

- Markdown is a separate rendering path from .txt. Plain .txt is set verbatim in monospace. A .md file is parsed and typeset the way Pandoc would render it to PDF: proportional body text, heading levels with their own font sizes and weights, bold/italic/inline-code spans, lists with indentation and bullets/numbers, block quotes, and horizontal rules. Monospace appears only in code blocks and inline code. This means the markdown path needs a small markdown parser and a styled-run layout model, not just line wrapping - scope it as its own child task or tasks, distinct from the plain-text one."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 10
created = 2026-08-04
tags = ["pdf", "text", "import"]
rebuild = true
emulator_debug = false
