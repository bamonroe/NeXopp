# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "add-mainactivity-reloadactivetab-that-re-reads-the-active-tab-from-its-uri"
title = "Add MainActivity.reloadActiveTab() that re-reads the active tab from its URI"
description = """
In app/src/main/java/com/nexopp/MainActivityDocuments.kt add 'internal fun MainActivity.reloadActiveTab()'. It re-reads the active tab's document from disk, discarding unsaved edits.

Behaviour: read 'tabs.active?.uri' (OpenTab.uri, app/src/main/java/com/nexopp/tabs/OpenTab.kt:22); if it is null, return without doing anything (the button is disabled in that case — see the sibling toolbar task). Otherwise parse it with Uri.parse and follow the same shape as openDocument(uri) at line 49 / loadDocument(staged, source) at line 91, but WITHOUT opening a new tab: stage the bytes off the UI thread with inBackground { io.stageIn(uri, "reload") } and then call the existing loadDocument(staged, uri) so the parsed document is installed into the current pane. loadDocument already calls surface.load(...), which clears the undo history (DrawingSurfaceView.kt:575) and re-renders.

After a successful load, clear the dirty flag by calling autoSave.reset() (the same call showTab makes at MainActivityTabs.kt:154). On a read/stage failure, do NOT close the tab (unlike openDocument) — leave the in-memory document untouched and surface the existing failure notice path used by openDocument.

Keep the function under ~40 lines; extract a private helper if it grows. Add KDoc explaining that reload is destructive to unsaved edits. Verify with: scripts/build.sh testDebugUnitTest"""
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 100
created = 2026-08-22
tags = ["reload", "io"]
rebuild = true
emulator_debug = false

[[task]]
id = "add-the-reload-toolbar-button-and-its-discard-confirmation-dialog"
title = "Add the reload toolbar button and its discard-confirmation dialog"
description = """
Depends on [add-mainactivity-reloadactivetab-that-re-reads-the-active-tab-from-its-uri]. Put a reload button in the editor top bar next to undo, gated by a confirmation dialog.

1. State: add 'var showReloadConfirm by mutableStateOf(false)' to app/src/main/java/com/nexopp/ui/EditorUiState.kt alongside showSettings (line 84) / showSaveAs (86).
2. Button: in EditorTopBar in app/src/main/java/com/nexopp/ui/EditorRegions.kt, immediately BEFORE the undo IconButton (~line 99), add an IconButton with Icons.Filled.Refresh, contentDescription "Reload from file", onClick = { ui.showReloadConfirm = true }, and enabled = whether the active tab has a save location (thread the boolean in as a new EditorTopBar parameter, e.g. 'canReload: Boolean', computed at the call site in ui/EditorScreen.kt from tabs.active?.uri != null). A never-saved Untitled document therefore shows the button greyed out.
3. Dialog: host it where the other editor dialogs are hosted (ui/EditorScreen.kt, near the Settings dialog at ~line 248) using the existing ConfirmDialog from app/src/main/java/com/nexopp/ui/Dialogs.kt:82 — title/text 'Discard unsaved edits and reload document?', confirmLabel 'Discard & Reload', onConfirm = { ui.showReloadConfirm = false; activity.reloadActiveTab() }, onDismiss = { ui.showReloadConfirm = false }. Follow the call-site pattern in ui/PaletteResetControls.kt:35.
4. Make sure the back button dismisses it: add the flag to app/src/main/java/com/nexopp/ui/EditorBackHandler.kt like the other dialog flags.
5. Docs in the SAME commit: describe the reload button in README.md, and add it to the editor-chrome section of docs/architecture.md (docs/architecture.md#the-editor-chrome-ui).

Verify with: scripts/build.sh"""
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 110
created = 2026-08-22
tags = ["reload", "ui"]
rebuild = true
emulator_debug = false

