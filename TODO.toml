[[task]]
id = "add-a-view-edit-mode-toggle-to-the-page-overview"
title = "Add a view/edit mode toggle to the page overview"
description = """
The multi-column page overview currently conflates navigation with editing: tapping any page selects it, which is disorienting when you only want a multi-column layout to read and navigate. Split the overview into two modes with an explicit toggle in the page overview chrome:

- View mode (default): multi-column grid is purely a display/navigation feature. Tapping a page jumps to it; no selection, no drag-to-reorder, no selection chrome. Column count (1-4) still works here.
- Edit mode: the current behaviour — tap to select pages, multi-select, drag to reorder, copy/paste, and delete selected pages as undoable edits.

The mode toggle lives in the same pages tooling that already hosts the column-count control. Mode should be obvious at a glance (e.g. toggle state plus selection chrome only appearing in edit mode), and leaving edit mode should clear any selection. Document in README.md."""
status = "active"
category = "feature"
urgency = "high"
order = 20
created = 2026-08-02
tags = []
rebuild = true
emulator_debug = true

[[task]]
id = "append-a-second-pdf-by-merging-into-one-joined-background-pdf"
title = "Append a second PDF by merging into one joined background PDF"
description = """
A .xopp document can reference only ONE background PDF, so importing a second PDF as Append currently can't work — Xournal++ sees two separate PDFs and the file can't span both. Fix by merging on our side:

- In edit mode, importing a PDF with Append merges the incoming PDF's pages onto the end of the existing background PDF, producing a single joined PDF that is the document's one background source.
- Hold the joined PDF in memory or in a local cache file while editing, so repeated appends compose without touching the original files.
- On Save, write the joined PDF out and point the .xopp background references at it (page numbers renumbered against the joined document).
- Save As is the easy case: we bundle/zip the PDF alongside the .xopp anyway, so just emit the joined PDF there.
- Round-trip check: the saved document must reopen in desktop Xournal++ with every appended page's background intact and strokes on the right pages.

Needs a minimal PDF page-concatenation path (dependency-free if practical, per the stack rules). Document the behaviour in README.md and the PDF background handling in docs/architecture.md."""
status = "active"
category = "feature"
urgency = "normal"
order = 30
created = 2026-08-02
tags = []
rebuild = true
emulator_debug = true
