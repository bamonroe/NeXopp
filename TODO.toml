[[task]]
id = "carry-jpeg-images-through-the-rnote-writer"
title = "Carry JPEG images through the .rnote writer"
description = """
A .xopp <image> holding JPEG bytes cannot be exported to .rnote. RawImageCodec.decodeToRaw is PNG-only by design (it just delegates to decodePng), so RnoteSnapshotWriter skips the picture and exportWarnings reports it as dropped. This is the last image-fidelity gap in the save path, but the right fix is not obvious yet, so scope it before writing code.

Investigate and decide between at least these approaches, then add the atomic task(s):
1. Hand-roll a baseline JPEG decoder alongside PngDecode.kt, matching the existing dependency-free, pure-JVM, returns-null-never-throws style. Faithful to how the rest of the format layer is built and fully unit-testable, but it is a large chunk of code (huffman, dequantise, IDCT, upsample) and progressive JPEGs would still be out.
2. Use android.graphics.BitmapFactory at runtime to get pixels, keeping the hand-rolled path for tests. Far less code, but the format layer deliberately avoids android.graphics because Bitmap is a throwing stub under JVM unit tests — so this needs an injection seam and would leave the JPEG path untested in the normal loop.
3. Check whether Rnote's bitmapimage stroke can carry the original encoded bytes rather than re-encoded raw pixels. Read what rnote 0.14.2 actually accepts in the image_data / format fields; if it takes JPEG directly, the whole decode step disappears and this becomes a small passthrough change. Validate any guess against rnote-cli test, the way the writer was validated originally.

Deliverable of this scope item: a written decision recorded in docs/architecture.md (the .rnote section owns it) plus the concrete follow-up task(s) added here. Close this item once its children exist."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 30
created = 2026-08-15
tags = ["rnote", "writer", "images"]
rebuild = true
emulator_debug = false

[[task]]
id = "reject-absurd-png-dimensions-in-pngdecode-before-allocating"
title = "Reject absurd PNG dimensions in PngDecode before allocating"
description = """
PngDecode.readHeader accepts any positive width/height from IHDR, so a malformed or hostile .xopp can claim a size whose row buffer overflows Int arithmetic: Header.stride is (width * bitsPerPixel + 7) / 8, and unfilterRows/deinterlace then allocate height * stride bytes. A width near Int.MAX_VALUE makes that product overflow to a negative size (NegativeArraySizeException) or a huge one (OutOfMemoryError), either of which escapes decode() as a throw. That breaks the contract the .rnote writer leans on — decodeToRaw returns null for anything it cannot read, never throws, so the picture is skipped and reported instead of sinking the save.

In app/src/main/java/com/nexopp/format/rnote/PngDecode.kt, in readHeader, after the width/height read, return null when the image cannot fit: compute the full-size byte count as a Long ((width.toLong() * bitsPerPixel + 7) / 8 * height) and reject anything over a sane ceiling (say 256 MiB of samples), alongside the existing width <= 0 / height <= 0 check. Keep it in readHeader so both the interlaced and non-interlaced paths are covered by one gate.

Verify in RawImageCodecTest: hand-build a PNG whose IHDR claims 0x40000000 x 0x40000000 (the existing assemble() helper takes width/height directly) and assert RawImageCodec.decodePng returns null rather than throwing. Run scripts/build.sh testDebugUnitTest."""
status = "active"
level = "task"
category = "bug"
urgency = "low"
order = 40
created = 2026-08-15
tags = []
rebuild = true
emulator_debug = false
