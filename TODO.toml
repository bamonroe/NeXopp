rebuild = true
emulator_debug = false

[[task]]
id = "generate-a-pdf-from-paginated-text-with-pdfbox"
title = "Generate a PDF from paginated text with PDFBox"
description = "Write the text-to-PDF generator: take the paginated lines and emit a real PDF with selectable, embedded text - no rasterising, no OCR. Follow the authoring template in render/PdfExporter.kt freshPage() (line 66): PDPage(PDRectangle) -> addPage -> PDPageContentStream -> beginText/setFont/newLineAtOffset/showText per line -> save. White background, monospace by default (the sensible choice for logs and source), using the embedded fonts. Measurement for the wrapper is PDFont.getStringWidth(s)/1000*size. Unit-test that the output opens, has the expected page count, and that PdfTextExtractor recovers the original text."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 50
created = 2026-08-04
