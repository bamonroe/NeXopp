[[task]]
id = "write-the-text-import-pdf-one-page-chunk-at-a-time"
title = "Write the text-import PDF one page chunk at a time"
description = "TextPdfGenerator.generate builds a single PDDocument holding every PDPage and only writes at doc.save (TextPdfGenerator.kt:26-33). PDFBox 2.x cannot append pages to an already-written file, so build the PDF in bounded chunks: for each N pages create a PDDocument, writePage into it, save to a temp file, close it, then merge the chunk files with the existing render/PdfMerger.kt into the output stream. Depends on the streaming paginator task. Verify with TextPdfGeneratorTest that page count, text extraction and the embedded non-Latin1 font all still round-trip."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 190
created = 2026-08-04
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "key-the-text-import-cache-by-a-streamed-file-hash"
title = "Key the text import cache by a streamed file hash"
description = "TextImport.pdfFor does staged.readText() to hold the whole file as a String, both for the SHA-256 cache key and to hand to the generator (TextImport.kt:37-50). Compute the key by streaming the file through a DigestInputStream (name + bytes) instead, and pass the staged File to the generator rather than a String, so nothing above one page is resident. Keep the existing cache-hit/miss semantics covered by TextImportTest."
status = "active"
level = "task"
category = "refactor"
urgency = "normal"
order = 200
created = 2026-08-04
tags = []
