[[task]]
id = "generate-rnote-test-fixtures-with-rnote-cli"
title = "Generate .rnote test fixtures with rnote-cli"
description = """
This box has Rnote installed: /usr/bin/rnote and /usr/bin/rnote-cli. `rnote-cli import` converts a `.xopp` file into a `.rnote` save file, `rnote-cli create` makes an empty one, and `rnote-cli test` validates that a file opens as a valid rnote file. That gives us ground-truth fixtures without hand-authoring anything.

Steps:
1. Run `rnote-cli help import` and `rnote-cli help export` and record the exact flag syntax in the commit message.
2. For each existing .xopp fixture in app/src/test/resources/fixtures/ (plain, backgrounds, layers, text-image — see app/src/test/java/com/nexopp/format/FormatDriftTest.kt), run `rnote-cli import` to produce the matching `.rnote` file, and validate each result with `rnote-cli test`.
3. Also run `rnote-cli create` once to capture a minimal empty document.
4. Commit the results to a NEW directory app/src/test/resources/fixtures/rnote/ named to match their .xopp sources (plain.rnote, backgrounds.rnote, layers.rnote, text-image.rnote, empty.rnote). Check their total size first — if the set exceeds a couple of MB, keep only plain, layers and empty and say so in the commit message.
5. Add a short README section: document in docs/tools.md (the external-tools spoke) that rnote/rnote-cli is available on the build box, the exact commands used to regenerate these fixtures, and that `rnote-cli test` is the validity check. This is a load-bearing command that must not live only in shell history.

No app code changes and no APK build are needed — this task only adds test resources and a tools-doc entry. Verify with `scripts/todo.sh validate` and by re-running `rnote-cli test` over every committed fixture."""
status = "active"
level = "task"
category = "test"
urgency = "normal"
order = 110
created = 2026-08-11
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "investigate-the-rnote-container-and-serialisation-format"
title = "Investigate the .rnote container and serialisation format"
description = """
Work out exactly what a `.rnote` file IS on disk, so a dependency-free Kotlin reader can be specified. Depends on the "Generate .rnote test fixtures with rnote-cli" task for real sample files.

Investigate and write down: the magic bytes / file signature (needed to extend app/src/main/java/com/nexopp/format/FileKind.kt, which classifies by content and not by extension); the compression wrapper, if any (gzip? zstd? none?); the serialisation inside it (JSON? MessagePack? a versioned header plus a payload?); and how the format has changed across Rnote versions — a reader must tolerate the versions the owner actually has files from. Cross-check findings against the Rnote source (github.com/flatpak/../flatpak-builder aside, the upstream repo is github.com/flxzt/rnote) rather than guessing from bytes alone.

Then decide, and record in docs/architecture.md as a dated design decision alongside the existing format decisions: whether the payload can be parsed with the repo`s dependency-free approach (the project already hand-rolls its XML layer — see app/src/main/java/com/nexopp/format/xml/) or genuinely needs a new dependency, and if so which one and why.

Output of this scope is TODO items, not code: add atomic `task` items for the reader — e.g. "extend FileKind with an RNOTE verdict", "add the container decompression layer", "parse the payload into an intermediate model", each fully specified with file paths and verification steps. Close this scope with `scripts/todo.sh done` once those children exist."""
