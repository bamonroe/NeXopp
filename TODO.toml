[[task]]
id = "resolve-relative-pdf-background-paths-when-reading-a-xopp"
title = "Resolve relative PDF background paths when reading a .xopp"
description = """
Finding (Xournal++ master, src/core/control/xojfile/LoadHandler.cpp:753 getAbsoluteFilepath and XmlParser.cpp parseBgPdf/parseBgPixmap): the only domain values are "absolute", "attach" and "clone" (clone is pixmap-only). There is no "relative" domain — a relative path is carried under domain="absolute", and the desktop reader resolves it against the .xopp file's own directory (xournalFilepath.remove_filename() / filename); an absolute path is used as-is. domain="attach" on a non-zip file resolves to the sibling "<xoppPath>.<filename>". If the resolved file is missing, desktop keeps the reference (setPdfAttributes) so the background is not silently dropped on save.

Task: make DocumentIo.resolvePdfBackground (io/DocumentIo.kt:167) handle these cases instead of only content:// and absolute File paths — resolve a relative reference against the parent directory of the .xopp being opened, and resolve a non-zip attach reference to the "<name>.xopp.<filename>" sibling. SAF constraint: for a content:// .xopp we only have a sibling directory when the document id is decomposable (DocumentsContract ids like "primary:Docs/foo.xopp"), so implement resolution for File-backed and tree-derived URIs and fall back to the existing missingPdf toast otherwise. Update docs/architecture.md (background/domain table) and README.md in the same commit."""
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 91
