#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "epic-radial-palette-tool-at-the-pen-tip"
title = "EPIC: radial palette tool at the pen tip"
description = "Large multi-part feature. A radial palette that pops up right at the pen tip location, made of two concentric rings: an inner ring of 8 segments and an outer ring of 16 segments. Any segment may be empty. Each filled segment holds a tool/action the user selects by flicking or tapping toward it. Sub-work to flesh out: (1) rendering the two-ring radial menu anchored at the pen tip, (2) hit-testing angle+radius to a segment, (3) invocation gesture (likely tied to the barrel button double-click or hold), (4) the palette configuration UI - how the user assigns tools to inner/outer slots and leaves others empty, (5) persistence of palette configuration, (6) possibly multiple palettes and how to switch between them. Break this epic into concrete child tasks before implementing."
status = "active"
level = "epic"
category = "feature"
urgency = "normal"
order = 20
created = 2026-08-04
tags = ["epic", "ui", "palette"]
rebuild = true
emulator_debug = true

[[task]]
id = "keep-the-radial-palette-open-until-you-click-off-it"
title = "Keep the radial palette open until you click off it"
description = "The radial menu currently dismisses as soon as a slot is selected. Instead it should stay open after a selection so several settings can be picked in one summoning, and only dismiss when the user taps/clicks outside the ring (or otherwise explicitly closes it)."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
