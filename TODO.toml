[[task]]
id = "investigate-the-rnote-container-and-serialisation-format"
title = "Investigate the .rnote container and serialisation format"
description = """
Work out exactly what a `.rnote` file IS on disk, so a dependency-free Kotlin reader can be specified. Depends on the "Generate .rnote test fixtures with rnote-cli" task for real sample files.

Investigate and write down: the magic bytes / file signature (needed to extend app/src/main/java/com/nexopp/format/FileKind.kt, which classifies by content and not by extension); the compression wrapper, if any (gzip? zstd? none?); the serialisation inside it (JSON? MessagePack? a versioned header plus a payload?); and how the format has changed across Rnote versions — a reader must tolerate the versions the owner actually has files from. Cross-check findings against the Rnote source (github.com/flatpak/../flatpak-builder aside, the upstream repo is github.com/flxzt/rnote) rather than guessing from bytes alone.

Then decide, and record in docs/architecture.md as a dated design decision alongside the existing format decisions: whether the payload can be parsed with the repo`s dependency-free approach (the project already hand-rolls its XML layer — see app/src/main/java/com/nexopp/format/xml/) or genuinely needs a new dependency, and if so which one and why.

Output of this scope is TODO items, not code: add atomic `task` items for the reader — e.g. "extend FileKind with an RNOTE verdict", "add the container decompression layer", "parse the payload into an intermediate model", each fully specified with file paths and verification steps. Close this scope with `scripts/todo.sh done` once those children exist."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 120
created = 2026-08-11
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "map-rnote-s-stroke-and-pen-model-onto-the-nexopp-document-model"
title = "Map Rnote's stroke and pen model onto the NeXopp document model"
description = """
Decide how Rnote content maps onto the internal model in app/src/main/java/com/nexopp/format/model/ (Document, Page, Layer, Stroke, StrokePoint, TextElement, ImageElement, TexImageElement, RawElement, Tool, LineStyle) — and, just as importantly, what is LOST in each direction.

The leverage here is that `rnote-cli import` (see the fixtures task) converts an existing `.xopp` into `.rnote`, giving a known-input/known-output pair: take each committed .xopp fixture and its converted .rnote twin and diff what survived. That tells us empirically how Rnote itself maps the Xournal++ model, which is the same mapping we need in reverse.

Investigate and record: how Rnote represents a brush stroke (its pen/brush styles and their width/pressure curves) versus our pressure polyline of StrokePoint(x, y, width); whether its shape strokes are stored as parametric shapes or flattened polylines, and what that means for our ShapeBuilder-produced strokes; how colour and alpha are stored versus XoppColor; whether it has a highlighter equivalent for Tool.HIGHLIGHTER; how text and embedded images are stored versus TextElement/ImageElement; and whether anything in Rnote has no `.xopp` representation at all.

Then write down a **lossy-mapping policy** in docs/architecture.md, as a dated decision: what we drop silently, what we preserve verbatim (RawElement already exists for exactly this — unmodelled markup that must survive a round trip), and what we refuse to import. The project`s guiding principle is round-trip safety, so the policy must state explicitly what a .rnote -> edit -> .rnote round trip is guaranteed to preserve.

Output is TODO items, not code: add atomic `task` items per element type conversion. Close this scope once they exist."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 130
created = 2026-08-11
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "decide-how-rnote-s-canvas-layout-maps-to-fixed-pages-and-layers"
title = "Decide how Rnote's canvas layout maps to fixed pages and layers"
description = """
Rnote is built around a continuous/infinite canvas with configurable layouts, while the NeXopp model (app/src/main/java/com/nexopp/format/model/Document.kt) is a list of fixed-size Pages each holding ordered Layers. Work out the correspondence before any reader is written, because it decides the shape of the whole importer.

Investigate against the real fixtures from the "Generate .rnote test fixtures with rnote-cli" task: what layout modes Rnote supports and how each is stored; whether a .rnote file records page boundaries at all or only a document extent plus a page size hint; how Rnote represents backgrounds (its pattern types and colours) versus our Background sealed interface in app/src/main/java/com/nexopp/format/model/Background.kt (Solid ruling styles, Pdf, Pixmap); whether Rnote has layers in our sense, and if not, what a multi-layer .xopp collapses to when `rnote-cli import` converts it (test this directly with the layers fixture); and how an embedded/annotated PDF is carried, versus our Background.Pdf plus the app/src/main/java/com/nexopp/io/PdfStore.kt reference machinery.

Then record the decision in docs/architecture.md: how an infinite-canvas document is cut into pages on import, and how our fixed pages are laid out on export. State the rule concretely enough that it can be implemented and tested.

Output is TODO items, not code: add atomic `task` items for the pagination and background conversion. Close this scope once they exist."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 140
created = 2026-08-11
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "scope-save-save-as-and-file-picker-handling-for-a-second-document-format"
title = "Scope save/save-as and file-picker handling for a second document format"
description = """
Every save path in the app currently assumes the document on disk is a `.xopp`. Before .rnote can be written, work out what has to become format-aware.

Read and map the current assumptions: app/src/main/java/com/nexopp/format/SaveFormat.kt (an enum of ORIGINAL vs ZIPPED — both `.xopp` variants; the "Save As makes it sticky" rule lives here); the saveLauncher registered with CreateDocument(XOPP_MIME) and the XOPP_MIME constant in app/src/main/java/com/nexopp/MainActivity.kt; the save path in app/src/main/java/com/nexopp/MainActivityDocuments.kt; app/src/main/java/com/nexopp/io/SaveTarget.kt; and the Save As dialog in app/src/main/java/com/nexopp/ui/EditorDialogs.kt (which offers the format choice today).

Decide: whether SaveFormat grows an RNOTE entry or whether a new orthogonal axis (document format x container variant) is the right model — the current enum conflates "which format" with "which .xopp container", and adding a third unlike entry may be the wrong shape. Also decide how the picker mime type and default extension follow the choice, what happens on a plain Save of a file that was opened as .rnote (does it stay .rnote?), and how the tab/session store in app/src/main/java/com/nexopp/tabs/ records which format a restored tab came from.

Note the overlap with the export work already broken out: ExportFormat (see the "Add an ExportFormat enum" task) carries mime/extension/label for every export target. Decide whether save formats should share that type or stay separate, and say why in the decision record.

Record the decision in docs/architecture.md next to the existing format decisions. Output is TODO items, not code: add the atomic `task` items the refactor breaks into. Close this scope once they exist."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 150
created = 2026-08-11
tags = []
rebuild = false
emulator_debug = false
