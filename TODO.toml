[[task]]
id = "rnote-encode-brushstroke"
title = "Encode a Stroke as an rnote brushstroke"
description = """
The export mirror of brushStrokeToStroke in app/src/main/java/com/nexopp/format/rnote/RnoteStrokeConvert.kt. Add app/src/main/java/com/nexopp/format/rnote/RnoteStrokeEncode.kt with 'fun strokeToBrushStroke(stroke: Stroke): JsonValue' building the JSON documented in docs/architecture.md ('The stroke & pen mapping'):

{"path":{"start":{"pos":[x,y],"pressure":p},"segments":[{"lineto":{"end":{"pos":[x,y],"pressure":p}}},...]},"style":{"smooth":{"stroke_width":w,"stroke_color":{r,g,b,a},"fill_color":null|{r,g,b,a},"pressure_curve":"linear","line_style":s,"line_cap":c}}}

- Geometry: every StrokePoint x/y through ptToPx (RnoteUnits.kt). Points[0] is 'start', the rest are 'lineto' segments in order. Always lineto, never quadbezto/cubbezto (gap matrix: 'always lineto').
- Pressure: stroke_width = max(point widths) * 4/3 (i.e. ptToPx of the max width); pressure_i = width_i / max. A max of 0 (or an empty point list) writes stroke_width 0 and pressure 1.0 rather than dividing by zero. This is the exact inverse of the import rule.
- pressure_curve is ALWAYS the string "linear" - upstream's default and the identity, so widths are not re-curved on reopen (gap matrix, load-bearing).
- stroke_color = rnoteColorOf(stroke.color) (RnoteUnits.kt).
- fill_color: null when Stroke.fill is null; otherwise the stroke colour at that alpha, i.e. rnoteColorOf((fill shl 24) or (color and 0x00FFFFFF)).
- line_style: PLAIN->"solid", DOTTED->"dotted", DASHED and DASH_DOT->"dashed_equidistant" (gap matrix).
- line_cap: capStyle "round" or null -> "rounded"; "butt" and "square" -> "straight" (gap matrix).
- Tool is NOT encoded here: highlighter-ness lives in the chrono layer slot, which slotFor() in RnoteDocumentWriterGeometry.kt already decides.

Add app/src/test/java/com/nexopp/format/rnote/RnoteStrokeEncodeTest.kt: encode a stroke, feed the result back through brushStrokeToStroke (wrapped in an RnoteStroke), and assert points, colour, fill, lineStyle, capStyle and uniformWidth survive; assert pressure_curve is "linear"; assert a zero-width stroke does not produce NaN.

Verify: scripts/build.sh testDebugUnitTest"""
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 305
created = 2026-08-13
tags = []
rebuild = false
emulator_debug = false

