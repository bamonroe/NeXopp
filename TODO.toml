[[task]]
id = "consolidate-store-newfile"
title = "Consolidate unique-filename allocation; fix thread-unsafe counters"
description = "Three copies of the unique-filename allocator, two thread-unsafe: io/ScratchDir.kt:19-33 uses an AtomicInteger (correct, with a comment explaining why), but io/PdfStore.kt:30-36 and io/ImageStore.kt:25-31 use a plain var counter (in ImageStore not even private) while being called from worker threads (via DocumentIo.copyIntoStore ~line 307 and ImageStore.copyIn ~34-38) — two threads can race on the same counter value. Fix: generalise ScratchDir.newFile(prefix, suffix = \".tmp\"), have PdfStore and ImageStore each hold a private ScratchDir and delegate (io/UriStaging.kt:51 already does exactly this), keeping current file extensions. Also extract the duplicated liveness sweep (ImageStore.kt:41-46 is a strict subset of PdfStore.kt:66-80) into an internal File.pruneUnreferenced(live, except) helper in a new io/StoreFiles.kt. Unit-test concurrent newFile allocation. Update the io/ list in docs/architecture.md for the new file. Full scripts/build.sh."
