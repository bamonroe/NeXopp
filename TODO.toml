[[task]]
id = "elementrenderer-identity-cache-keys"
title = "ElementRenderer: key bitmap and tex caches by identity, not content hash"
description = "render/ElementRenderer.kt:80 uses bitmapCache.getOrPut(img) where img is an ImageElement whose equals/hashCode (format/model/Element.kt:76) run contentEquals/contentHashCode over the entire byte array — O(megabytes) of hashing plus comparison per image per painted frame at up to 120 Hz. texCache (~line 91) has the identical problem, and its own KDoc already says the tree should be cached by element identity. Fix: rekey both caches by reference identity — java.util.IdentityHashMap, or a small wrapper key using System.identityHashCode plus reference equality. Pure performance fix, no behaviour change; verify by build and existing tests."
