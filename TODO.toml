[[task]]
id = "preserve-unknown-attributes"
title = "Round-trip: preserve unknown attributes on all elements, not just strokes"
description = "Core-rule fidelity gap. format/XoppReader.kt preserves unknown attributes only on stroke elements (extraAttrs, ~lines 99-104). readText (~126), readImage (~136), readTexImage (~145), readLayer (~80), readPage (~45) and readBackground (~62) each read a fixed attribute set and drop the rest. Most consequential: desktop Xournal++ text elements can carry the same audio fn/ts pair strokes do (see audio/AudioAnnotation.kt:22-25), so audio links on text boxes are silently lost on save; solid-background config attributes (custom ruling spacing on newer desktop builds) are dropped too. Fix: add extraAttrs: Map<String,String> to TextElement, ImageElement, TexImageElement (format/model/Element.kt), and to Layer, Page and the Background variants, populated with the same filterKeys pattern used for strokes at XoppReader.kt:100, and re-emit them first in each XoppWriter.write* the way writeStroke does (XoppWriter.kt ~75). Round-trip unit tests: parse XML with an unknown attribute on each element kind, save, assert it survives byte-identically. Update the schema-mapping notes in docs/architecture.md in the same commit."
