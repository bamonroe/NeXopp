# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "export-flattened-documents-to-pdf-svg-png-jpg-and-other-raster-vector-formats"
title = "Export flattened documents to PDF, SVG, PNG, JPG and other raster/vector formats"
description = "Investigate and break down export support: render pages (strokes, text, images, backgrounds, PDF-backed pages) flattened into common output formats — vector (PDF, SVG) and raster (PNG, JPG, and other common types such as WEBP). Needs decisions on: page-range/selection UI, DPI/scale options for raster, whether to embed or rasterize the underlying PDF background, SAF file-picker output targets, and which rendering path (shared Canvas renderer vs a separate export renderer) to reuse. Produce concrete atomic tasks per format/pipeline, not code."
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 10
created = 2026-08-11
tags = ["export", "pdf", "svg", "raster"]
rebuild = true
emulator_debug = false

[[task]]
id = "support-rnote-file-format"
title = "Support rnote file format"
description = "Support reading and saving Rnote (.rnote) files alongside .xopp, so notes taken in NeXopp can round-trip with Rnote on the desktop. Scope out over several rounds: the .rnote container/serialization format, how its stroke/pen model maps to the internal document model, layers/pages/backgrounds equivalence, lossy-mapping policy, and save/save-as filename+extension handling in the file picker. Spawn scope items for investigation and task items where the work is already clear."
status = "active"
level = "epic"
category = "feature"
urgency = "normal"
order = 20
created = 2026-08-11
tags = ["rnote", "format", "interop"]
rebuild = true
emulator_debug = false
