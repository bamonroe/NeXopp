# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "open-a-pdf-handed-in-by-an-incoming-intent"
title = "Open a PDF handed in by an incoming intent"
description = "Handle the launch intent (and onNewIntent) in MainActivity: take the ACTION_VIEW/ACTION_EDIT data URI, take a persistable read permission where granted, and route it through the same open path the SAF picker uses. FileKind.sniff already classifies the bytes and LoadedFile.Pdf already becomes a fresh annotatable document over the PDF pages, so this is wiring the URI in, not new format work. Cover the intent-to-URI extraction with a unit test."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 60
created = 2026-08-04
tags = ["pdf", "intent"]
rebuild = true
emulator_debug = true

[[task]]
id = "save-an-intent-opened-pdf-back-out-as-a-xopp-document"
title = "Save an intent-opened PDF back out as a .xopp document"
description = "A PDF arriving by intent has no .xopp target on disk. Make the first save prompt for a .xopp destination via CreateDocument, defaulting the name to the PDF's display name with a .xopp suffix, and keep the PDF as the page background so it round-trips to desktop Xournal++. Unit-test the default-name derivation."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 70
created = 2026-08-04
tags = ["pdf"]
rebuild = true
emulator_debug = false

[[task]]
