title = "Lay out markdown blocks into pages with block styling"
description = "Compose parsed blocks into pages: per-heading-level font size and weight, space-before/space-after between blocks, list indentation with bullet or number markers, block-quote indent (and a rule if wanted), horizontal rules, and code blocks set in monospace at a fixed size with their own indent. Owns page breaking - a block spans pages, and a heading should not be orphaned at the page foot. Extends the PageSpec idea into a markdown style spec so sizes live in one place. Pure Kotlin over the styled wrapper; unit-tested for block spacing, indent arithmetic, and page-break behaviour."
