[[task]]
id = "escape-control-chars-in-attrs"
title = "XmlWriter: escape newline, CR and tab in attribute values"
description = "format/xml/XmlWriter.kt escapeInto (~lines 76-84) escapes ampersand, angle brackets and double quote but not newline, carriage return or tab in attribute values. Preserved extraAttrs values containing a newline are read back verbatim by our own parser but normalised to a space by any conforming XML parser (attribute-value normalisation), silently breaking round-trip with desktop Xournal++. Fix: when writing attribute values, emit &#10; &#13; &#9; for those characters. Unit test: an attribute value containing newline and tab survives XmlWriter -> XmlPullReader unchanged. Do together with or immediately after preserve-unknown-attributes, which widens the surface this bug applies to. scripts/build.sh testDebugUnitTest."
