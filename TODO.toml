[[task]]
id = "paste-should-leave-the-pasted-content-as-the-active-editable-selection"
title = "Paste should leave the pasted content as the active, editable selection"
description = "pasteOnto (app/src/main/java/com/nexopp/render/DrawingSurfaceSelection.kt:103) sets ActiveSelection and fires onSelectionChanged(true), but if the active tool is BG_SELECT the gesture layer never reaches SelectionGestureController (DrawingSurfaceInput.kt:221 activeTool()), so the pasted elements draw as selected yet cannot be dragged, resized or rotated — and the next touch starts a new marquee, which calls gestures.clearSelection() (BackgroundSelection.kt:22) and destroys the selection outright. On paste, switch the tool to EditorTool.SELECT so the pasted item is immediately manipulable. Either add a surface->chrome tool-change callback next to onSelectionChanged (DrawingSurfaceView.kt:418) or set ui.tool/applyTool at the onPaste lambda (EditorOverlays.kt:130). Update README.md and docs/architecture.md in the same commit."
status = "active"
