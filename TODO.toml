[[task]]
id = "give-every-document-its-own-background-pdf-file-fixed-cache-names-collide"
title = "Give every document its own background PDF file (fixed cache names collide)"
description = "Root cause of the blanked-pages bug. Three call sites write a background PDF to a single fixed path shared by every document and both panes: XoppZip.open extracts to cacheDir/background.pdf (format/XoppZip.kt:76), MainActivity.resolvePdfBackground copies to cacheDir/background.pdf (MainActivity.kt:348), and adoptPdf copies to cacheDir/imported.pdf (MainActivity.kt:377). Pane A keeps a PdfPageCache holding a ParcelFileDescriptor open on that path; opening a PDF-backed document in pane B (or in a second tab) rewrites the bytes underneath it, so pages A has not rasterised yet come back blank while already-cached pages stay correct - exactly the reported symptom, and reloading fixes it. Fix: key the staged PDF by tab/doc id (e.g. cacheDir/pdf/<docKey>.pdf), have TabStore/OpenTab.pdfPath point at that per-document file, and delete it when the tab closes."
status = "active"
category = "bug"
urgency = "critical"
order = 20
created = 2026-08-03
tags = []
rebuild = true
emulator_debug = true

[[task]]
id = "stage-remote-opens-to-unique-temp-files-open-tmp-is-shared"
title = "Stage remote opens to unique temp files (open.tmp is shared)"
description = "Likely root cause of the tabs-overwriting-each-other bug. UriStaging.newFile builds a fixed path '<name>.tmp' (io/UriStaging.kt:45), so every open uses cacheDir/staging/open.tmp. MainActivity.openDocument runs stageIn on a background thread (inBackground, MainActivity.kt:254); over a slow remote provider two opens overlap and the second download overwrites the first's bytes before or while it is parsed, so both tabs end up loading the same document. Fix: make newFile unique per call (counter or tab id) and delete it after the load; consider serialising opens or cancelling a superseded one."
status = "active"
category = "bug"
urgency = "high"
order = 30
created = 2026-08-03
tags = []
rebuild = true
emulator_debug = false

[[task]]
id = "unit-test-per-document-pdf-and-staging-paths-for-collisions"
title = "Unit-test per-document PDF and staging paths for collisions"
description = "Guard the two fixes above with JVM tests: two XoppZip.open calls into the same cacheDir must yield two distinct extant PDF files; two UriStaging.stageIn calls must return distinct files whose contents match their own sources; a two-tab session must round-trip through TabIndex/TabStore with distinct pdfPath values."
status = "active"
category = "test"
urgency = "normal"
order = 40
created = 2026-08-03
tags = []
rebuild = true
emulator_debug = false

[[task]]
id = "make-pdfpagecache-tolerate-a-replaced-source-file"
title = "Make PdfPageCache tolerate a replaced source file"
description = "Defence in depth for the blanked-pages bug: PdfPageCache holds a read-only ParcelFileDescriptor (render/PdfPageCache.kt:46) and silently yields blank pages if the underlying file is rewritten. Detect the change (size/mtime or an explicit invalidate hook) and either re-open the renderer or surface an error instead of rendering white pages."
status = "active"
category = "refactor"
urgency = "normal"
order = 50
