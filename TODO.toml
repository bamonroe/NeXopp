# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "add-parameterized-panning-sensitivity"
title = "Add parameterized panning sensitivity"
description = "Add a panning sensitivity setting with a continuous/parameterized value. A value of 1.0 should mean one-to-one document movement with the finger/stylus pan distance. A value of 0 should mean panning input produces no document movement. Values between 0 and 1 should pan slower than the input movement, and values greater than 1 should pan faster than the input movement."
status = "active"
category = "feature"
urgency = "normal"
order = 60
created = 2026-07-31
tags = ["panning", "settings", "gestures"]
rebuild = true
emulator_debug = false

[[task]]
id = "align-annotation-overlay-on-rotated-pdf-pages"
title = "Align annotation overlay on rotated PDF pages"
description = "PdfExporter preserves a source PDF page's vectors via importPage, but the annotation overlay (PdfVectorPainter/PdfPageTransform) assumes an unrotated page (/Rotate 0). On a rotated source page the vectors are kept but the overlay may be misaligned. Apply a rotation-aware transform (translate + rotate matrix + crop origin) so strokes land correctly on 90/180/270-rotated pages."
status = "active"
category = "bug"
urgency = "normal"
order = 70
created = 2026-07-31
tags = ["pdf", "export"]
rebuild = true
emulator_debug = false

[[task]]
id = "ocr-scanned-image-only-pdfs-for-text-selection"
title = "OCR scanned (image-only) PDFs for text selection"
description = "The Select text (PDF) tool uses PDFBox's extracted text layer, which covers born-digital PDFs but yields nothing for scanned image-only pages (PdfTextIndex.hasAnyText is false). Add an on-device OCR fallback (e.g. Google ML Kit text recognition) that runs on pages with no text layer, producing positioned words to feed the same PdfTextIndex. Requires a new dependency (ML Kit) - confirm before adding."
status = "active"
category = "feature"
urgency = "normal"
order = 80
created = 2026-07-31
tags = ["pdf", "ocr", "selection"]
rebuild = true
emulator_debug = false
