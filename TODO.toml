[[task]]
id = "wrap-styled-runs-against-per-style-font-metrics"
title = "Wrap styled runs against per-style font metrics"
description = "TextPaginator wraps a single font per line via one (String) -> Float measurer. Markdown needs multiple faces and sizes on one line, so add a styled wrapper that takes a measurer per style key (proportional regular/bold/italic/bold-italic, monospace for code) and greedily fills a line by run fragments, splitting a run mid-word only on the same hard-break rule as today. Emits laid-out lines as positioned run fragments with an x offset and a style. Keep TextPaginator's plain path intact and factor the shared wrapping logic rather than duplicating it. Pure and unit-tested with synthetic metrics."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 140
created = 2026-08-04
tags = ["markdown"]
rebuild = false
emulator_debug = false

