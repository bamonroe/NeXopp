[[task]]
id = "lasso-decide-whether-selection-should-be-limited-to-the-active-layer"
title = "Lasso: decide whether selection should be limited to the active layer"
description = "inPolygon and inRect sweep every layer on the page, so a lasso can pick up objects on layers the user is not editing. Desktop Xournal++ selects within the current layer. Check the desktop behaviour, then make NeXopp match it (probably: restrict both containment queries to the active layer), and cover the choice with a unit test."
