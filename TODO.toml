# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "cap-text-import-pdf-generation-size-and-expose-the-cap-in-settings"
title = "Cap text-import PDF generation size and expose the cap in settings"
description = "Bound the cost of importing a several-hundred-megabyte log. Enforce a per-file size cap on text import with a clear user-facing message when a file exceeds it, and generate lazily/incrementally rather than converting the whole file up front. Add a cache size cap enforced in io/PdfStore.kt (which today prunes only by liveness, see prune() line 40) and wired through DocumentIo.prune(live) (line 160), which MainActivity already calls on session persist. Expose both caps as an Advanced/Storage section in settings: there is no such section today, so add the AppSettings field plus KEY_ const and load/save lines in ui/AppSettings.kt, a SettingsSection enum entry in ui/SettingsScreen.kt, and the composable in ui/SettingsSections.kt (EditorSection line 137 is the simplest pattern)."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 70
created = 2026-08-04
tags = ["text-import", "settings"]
rebuild = true
emulator_debug = false

[[task]]
id = "typeset-markdown-files-pandoc-style-rather-than-verbatim"
title = "Typeset markdown files Pandoc-style rather than verbatim"
description = "A .md file is a separate rendering path from .txt: parsed and typeset the way Pandoc would render it to PDF, not set verbatim in monospace. That means proportional body text; heading levels with their own sizes and weights; bold, italic and inline-code spans; lists with indentation and bullets/numbers; block quotes; and horizontal rules. Monospace appears only in code blocks and inline code. This needs a small dependency-free markdown parser and a styled-run layout model - the plain-text wrapper handles a single font per line and is not sufficient. Investigate and break this into atomic tasks once the plain-text path (parser, styled-run wrapping, block layout, PDF emission of styled runs) is landed and its shape is known."
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 80
created = 2026-08-04
tags = ["text-import", "markdown"]
rebuild = true
emulator_debug = false

[[task]]
id = "investigate-relative-pdf-background-paths-in-the-xopp-format"
title = "Investigate relative PDF background paths in the xopp format"
description = "Today every PDF background we write is linked with domain=\"absolute\" and a full path/URI (see docs/architecture.md, the SaveFormat table, and format/Xopp.kt). Desktop Xournal++ appears to support other domains for the background filename — investigate what the real format and the desktop reader actually accept: read the Xournal++ source/spec for the <background filename=... domain=...> attribute, and confirm by experiment whether a path relative to the .xopp file's own directory round-trips when reopened on desktop Linux. Establish what the relative path is resolved against, whether Android's SAF content:// world can even produce a meaningful relative path, and what happens on desktop when the reference does not resolve. If relative paths do work, add the atomic tasks to implement them: the writer change in the save path, the resolution change in the reader/relink path, a user-facing preference or heuristic for when to prefer relative over absolute, round-trip tests, and the README/architecture doc updates. If they do not work, close this scope with the finding recorded rather than adding children."
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 90
created = 2026-08-04
tags = ["format", "pdf", "round-trip"]
rebuild = false
emulator_debug = false
