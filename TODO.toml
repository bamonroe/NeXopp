[[task]]
id = "fill-alpha-range-decision"
title = "Resolve fill-alpha range disagreement (0..255 vs 1..255)"
description = "Stroke fill alpha is clamped to different ranges: format/XoppReader.kt:97 coerces 0..255 (the file format legitimately allows fill=\"0\"), while ui/AppSettings.kt:250 and ui/ToolPresetCodec.kt:65 coerce 1..255 — so a document read with fill=0 cannot be reproduced by the editor controls. Decide and record: the model keeps 0..255 and the UI pickers keep 1..255, with a comment at each site explaining why they differ (or widen the UI to 0). Minimal code change; the point is that the divergence becomes deliberate instead of accidental."
