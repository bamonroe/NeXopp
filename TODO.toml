# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "emulator-pass-confirm-an-unsaved-untitled-document-survives-a-kill"
title = "Emulator pass: confirm an unsaved Untitled document survives a kill"
description = """
End-to-end verification of the untitled data-loss fixes, on the /data/android emulator (see docs/tools.md). Run AFTER the three fix tasks land.

Steps:
1. scripts/build.sh, install the debug APK on the emulator.
2. Turn both autosave timers on in Settings (idle 5s, interval 60s).
3. On a fresh Untitled tab (never saved anywhere), draw several strokes across a page with simulated stylus input. Take a screenshot of the drawn page.
4. Wait past the idle timer, then kill the process outright with 'adb shell am force-stop com.nexopp' - do NOT background it cleanly first, so onPause's snapshot is skipped.
5. Relaunch and screenshot: the Untitled tab must come back with every stroke from step 3.
6. Repeat with the process killed DURING a snapshot write (kill immediately after a stroke) to exercise the atomic temp-file+rename path; the tab must come back with either the previous or the newest content, never blank.
7. Check adb logcat for exceptions from TabStore over the whole run.

Record the outcome in the task before closing it. This is the regression gate for the whole untitled-data-loss scope."""
status = "active"
level = "task"
category = "test"
urgency = "high"
order = 50
created = 2026-08-19
tags = ["autosave", "tabs", "data-loss"]
rebuild = true
emulator_debug = true
