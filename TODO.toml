# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "detect-text-files-in-filekind-and-accept-text-plain-intents"
title = "Detect text files in FileKind and accept text/plain intents"
description = "Add a TEXT kind to format/FileKind.kt. Plain text has no magic bytes, so this is a fallback rule rather than a prefix match: bump FileKind.MAGIC_BYTES above 8, sample the head of the stream, and classify as TEXT when the sample decodes as valid UTF-8 printable text (allowing tab/CR/LF), leaving UNKNOWN as the catch-all for binary. Keep FileKind.of() pure and extend app/src/test/java/com/xopp/android/format/FileKindTest.kt with UTF-8, ASCII, empty-file, BOM and binary cases. Then add text/plain VIEW+EDIT intent filters to AndroidManifest.xml alongside the existing application/pdf ones (lines 30-52), including the file:// pathPattern fallback for .txt and .md, so the app appears in the share/open-with sheet for text files."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 20
created = 2026-08-04
tags = ["text-import", "format"]
rebuild = true
emulator_debug = false

[[task]]
id = "wrap-and-paginate-plain-text-against-a-page-size"
title = "Wrap and paginate plain text against a page size"
description = "Add an Android-free layout unit that turns a string into pages of laid-out lines. Extend render/TextBlock.kt (or a sibling in the same style) with a wrap(text, maxWidth, measure: (String) -> Float) that breaks on whitespace, hard-breaks over-long runs (long log lines, no spaces), expands tabs, and preserves existing newlines verbatim. Then paginate: given page width/height and margins, fill lines at LINE_HEIGHT_RATIO spacing until the page is full and start the next. Page size comes from the A4 constants in render/DrawingSurfaceView.kt (A4_WIDTH_PT/A4_HEIGHT_PT) - there is no user default paper pref today, so hardcode A4 for now and note it. Measurement is injected so the unit stays free of PDFBox and Android; unit-test wrapping, hard breaks, tab expansion and page boundaries."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 30
created = 2026-08-04
tags = ["text-import", "layout"]
rebuild = true
emulator_debug = false

[[task]]
id = "embed-an-open-licence-font-pair-for-generated-pdfs"
title = "Embed an open-licence font pair for generated PDFs"
description = "render/PdfVectorPainter.kt uses base-14 PDType1Fonts and sanitize() (line 195) drops anything outside 0x20..0xFF, which would mangle arbitrary UTF-8 in an imported text file. Ship one permissively licensed proportional family and one monospace (e.g. an OFL pair with broad Unicode coverage) as app assets, load them with PDType0Font.load so they embed and subset into the generated PDF, and route the text-import path through them instead of the base-14 fonts. Document the chosen fonts and their licences, and define the fallback for codepoints the font lacks (substitution glyph rather than a crash). Keep the existing base-14 path for .xopp text elements unchanged unless it is trivially shareable."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 40
created = 2026-08-04
