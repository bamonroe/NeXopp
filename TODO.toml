[[task]]
id = "skip-synchronous-ink-rasterisation-mid-fling"
title = "Skip synchronous ink rasterisation mid-fling"
description = "InkCache.draw/entryFor rasterise a full-page ARGB bitmap synchronously inside paint() when a page enters the viewport; during a fling that lands on nearly every frame and makes the scroll jerky. Add a rasterOk parameter to InkCache.draw; when false and no entry is cached, return false so drawPageElements falls back to direct element drawing (viewport-culled). Pass !momentum.isFlinging from drawPageElements. Verify: fling is smooth; ink rasters still build once the fling settles."
status = "active"
level = "task"
category = "bug"
urgency = "critical"
order = 20
created = 2026-09-11
tags = []
rebuild = false
emulator_debug = false

[[task]]
id = "drop-queued-pdf-renders-for-pages-a-fling-left-behind"
title = "Drop queued PDF renders for pages a fling left behind"
description = "During a fast flick the single pdf-raster worker queues whole-page renders for every page crossed; by the time they run the pages are gone, and live pages' renders queue behind them. Override stale() in PdfPageCache to also drop a non-tiled key whose page is farther than 3 pages from every page in retainedPages (skip pruning while retainedPages is empty). Verify: flinging far lands sharp pages faster; unit tests pass."
status = "active"
level = "task"
category = "bug"
urgency = "critical"
order = 30
created = 2026-09-11
tags = []
rebuild = true
emulator_debug = false
