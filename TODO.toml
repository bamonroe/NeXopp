[[task]]
id = "add-a-slot-number-palette-action-for-presets"
title = "Add a slot-number palette action for presets"
description = "PaletteAction.ApplyPreset stores a preset id (RadialPalette.kt:69), so a palette slot follows a specific preset rather than a position. Add a position-based action (ApplyPresetSlot(index)) that resolves settings.presets[index] at flick time in PaletteActions.kt, so slot 'preset 1' always fires whatever preset sits first. Cover the codec (RadialPaletteCodec.kt) and its round-trip test."
