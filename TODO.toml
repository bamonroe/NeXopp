tags = []
rebuild = true
emulator_debug = true

[[task]]
id = "lasso-don-t-select-unmodelled-rawelements-at-the-page-origin"
title = "Lasso: don't select unmodelled RawElements at the page origin"
description = "ElementBounds.of gives RawElement an empty box at (0,0,0,0) (app/src/main/java/com/nexopp/render/ElementBounds.kt:80). That is meant to keep it out of every hit test, but inPolygon/inRect treat the degenerate box as a real one, so any lasso or rubber-band drawn over the top-left corner of the page wholly encloses it and selects every unmodelled element. Make the hit tests skip elements with no trustworthy geometry explicitly rather than relying on the empty box, and cover it with a unit test."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 60
created = 2026-08-10
tags = []
rebuild = true
emulator_debug = false

[[task]]
id = "lasso-give-thin-strokes-and-text-the-same-tap-padding-as-a-tap-pick"
title = "Lasso: give thin strokes and text the same tap padding as a tap pick"
description = "pickTopmost expands bounds by ElementBounds.TAP_PAD before hit-testing, but inPolygon/inRect do not. A hairline stroke or an empty text box traced closely by the lasso can fall just outside the polygon and be missed even though the user clearly enclosed it. Decide the rule (likely: no pad for containment, but tolerate points within TAP_PAD of the polygon edge) and apply it consistently across the containment tests, with unit tests."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 70
created = 2026-08-10
tags = []
