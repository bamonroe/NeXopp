[[task]]
id = "typeset-markdown-files-pandoc-style-rather-than-verbatim"
title = "Typeset markdown files Pandoc-style rather than verbatim"
description = "A .md file is a separate rendering path from .txt: parsed and typeset the way Pandoc would render it to PDF, not set verbatim in monospace. That means proportional body text; heading levels with their own sizes and weights; bold, italic and inline-code spans; lists with indentation and bullets/numbers; block quotes; and horizontal rules. Monospace appears only in code blocks and inline code. This needs a small dependency-free markdown parser and a styled-run layout model - the plain-text wrapper handles a single font per line and is not sufficient. Investigate and break this into atomic tasks once the plain-text path (parser, styled-run wrapping, block layout, PDF emission of styled runs) is landed and its shape is known."
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
