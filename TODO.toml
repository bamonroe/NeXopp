[[task]]
id = "add-page-should-insert-a-blank-page-not-duplicate-the-current-one"
title = "Add-page should insert a blank page, not duplicate the current one"
description = "'Add page' visually duplicates the current page instead of inserting a blank one. Root cause: PageOps.addAfter (PageOps.kt:15-20) does pages[i].copy(layers = emptyLayer), which clears ink but inherits the source Background verbatim — including width/height AND, critically, a Background.Pdf(pageNo=N), so the new page re-renders the identical PDF page underneath. Fix: give the new page a blank solid background (Background.Solid(0xFFFFFFFF.toInt(), <default style>)) rather than copying a PDF/pixmap background; keep width/height (usually desired) but drop the inherited pdf pageNo. Consider a 'new page type' setting like desktop Xournal++ (blank default / copy current style / plain) and default it to blank. Update PageOpsTest.kt (it currently pins the duplicate behavior) and DrawingSurfaceView.kt:414 + PageOps.kt:8-11 doc comments. Depends conceptually on background-style-picker/page-sizes for the default it uses."
status = "active"
category = "bug"
urgency = "normal"
order = 30
created = 2026-08-01
tags = ["pages"]
rebuild = true
emulator_debug = true
