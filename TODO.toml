# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "show-a-fading-top-bar-spinner-while-an-autosave-is-in-flight"
title = "Show a fading top-bar spinner while an autosave is in flight"
description = """
Depends on the autoSaving flag added by run-the-autosave-encode-write-off-the-ui-thread-behind-a-non-blocking-saving-flag.

1. In app/src/main/java/com/nexopp/ui/EditorRegions.kt add a 'saving: Boolean = false' parameter to EditorTopBar (signature at line 73) and render, as the FIRST item in the actions row before SearchControls(pane), an AnimatedVisibility(visible = saving, enter = fadeIn(), exit = fadeOut()) wrapping a CircularProgressIndicator with Modifier.size(18.dp), strokeWidth = 2.dp, and Modifier.semantics { contentDescription = "Saving" } (or wrap in a Box with that semantics).
2. In app/src/main/java/com/nexopp/ui/EditorScreen.kt add a matching 'saving: Boolean = false' parameter next to the existing 'busy: String? = null' (line 166) and pass it through to EditorTopBar.
3. In MainActivity.kt where EditorScreen is invoked (around line 305, beside 'busy = busy.value') pass 'saving = autoSaving.value'.

Do not touch the blocking TransferOverlay path — the spinner is only for quiet autosaves.

Verify: scripts/build.sh, then on the emulator trigger an autosave and screenshot the top bar to confirm the spinner appears and fades out. Update docs/architecture.md's editor-chrome section and README.md in the same commit."""
status = "active"
level = "task"
category = "feature"
urgency = "high"
order = 40
created = 2026-08-17
tags = []
rebuild = true
emulator_debug = true

[[task]]
id = "unit-test-the-autosave-saving-state-transitions"
title = "Unit-test the autosave saving-state transitions"
description = """
Add app/src/test/java/com/nexopp/io/ (or the existing autosave test file — check for AutoSavePolicyTest.kt first and extend it) JVM tests covering the quiet-autosave state machine added by run-the-autosave-encode-write-off-the-ui-thread-behind-a-non-blocking-saving-flag. MainActivity is not unit-testable, so first extract the guard logic from autoSaveNow() into a pure function in the io package, e.g. 'fun canAutoSave(hasSurface: Boolean, blocking: Boolean, alreadySaving: Boolean, hasWritableTarget: Boolean): Boolean' returning true only when hasSurface && !blocking && !alreadySaving && hasWritableTarget, and have autoSaveNow() call it.

Tests to write: each of the four false inputs individually blocks the save; all-true allows it. Also assert AutoSavePolicy's existing behaviour is untouched. Run with scripts/build.sh testDebugUnitTest. Update docs/architecture.md's 'What the unit tests cover' section in the same commit."""
status = "active"
level = "task"
category = "test"
urgency = "normal"
order = 50
created = 2026-08-17
tags = []
rebuild = false
emulator_debug = false
