{"text":<content>,"transform":{"affine":[1,0,0,-0,1,0,x,y,1]},"text_style":{"font_family":f,"font_size":s,"font_weight":w,"font_style":"regular"|"italic","color":{r,g,b,a},"max_width":null,"alignment":"start","ranged_text_attributes":[]}}

- The affine is COLUMN-MAJOR (nalgebra): translation at indices 6 and 7, and the fixtures write index 3 as -0.0. Add a shared 'fun affineOf(x: Double, y: Double): JsonValue' in RnoteStrokeEncode.kt so the bitmapimage encoder reuses it; x/y are ptToPx(text.x), ptToPx(text.y).
- font_family / bold / italic come from parsing TextElement.font with com.nexopp.format.FontDescription (the same class the import side uses to compose it) - check its parse entry point and use it rather than re-parsing the Pango string here.
- font_weight: 700 when bold, else 400. font_style: "italic" when italic, else "regular".
- font_size = ptToPx(text.size). color = rnoteColorOf(text.color).
- max_width and alignment are Rnote's defaults (null / "start") and ranged_text_attributes is always empty - a .xopp text box has one uniform style (gap matrix, Text section).
