[[task]]
id = "preserve-a-relative-pdf-background-reference-across-save"
title = "Preserve a relative PDF background reference across save"
description = """
Desktop Xournal++ remembers how the path was stored (Document::setPathStorageMode, set in LoadHandler::getAbsoluteFilepath) and re-normalizes on save (SaveHandler.cpp, Util::normalizeAssetPath with the stored mode), so a relative reference stays relative and stays portable. Our ORIGINAL save path (io/DocumentIo.kt:227) writes back whatever string it read, which is already lossless for a relative reference — but only by accident, and PdfBackgroundDomain.documentWithPdfReference/documentWithPdfDomain can overwrite it with an absolute content:// URI on any relink or PDF merge.

Task: carry the original reference string and its relative-ness on the document/save state so that a desktop-authored relative reference survives edit and save unchanged, and is not silently rewritten to a content:// absolute reference by a merge or a domain rewrite. Add the round-trip test alongside PdfBackgroundRoundTripTest, and update docs/architecture.md."""
