schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "jpeg-wire-rawimagecodec"
title = "Wire JPEG decoding into RawImageCodec and flip the docs"
description = "Depends on jpeg-decode-baseline. In RawImageCodec.decodeToRaw (app/src/main/java/com/nexopp/format/rnote/RawImageCodec.kt), sniff the first bytes: PNG signature -> PngDecode as today; JPEG SOI (0xFF 0xD8) -> JpegDecode.decode; anything else or a null decode -> null as today, so RnoteSnapshotWriter and RnoteExportWarnings.isEncodable pick JPEG support up automatically with no changes of their own. Add a RawImageCodecTest case proving a fixture JPEG now encodes (and a progressive one still reports as unreadable via isEncodable). Update docs/architecture.md: flip the bitmap-pixels row of the Images feature-gap matrix from report-for-JPEG to keep (baseline; progressive still reports), and adjust the 2026-08-13 JPEG note to point at the 2026-08-15 decision. Update README.md if it mentions the JPEG limitation. Regenerate nothing; validate one exported .rnote containing a JPEG-backed image with rnote-cli test per docs/tools.md. Verify with scripts/build.sh testDebugUnitTest."
status = "active"
