[[task]]
id = "hoist-editorscreen-s-loose-state-into-a-single-state-holder"
title = "Hoist EditorScreen's loose state into a single state holder"
description = "EditorScreen.kt's top-level composable is ~400 lines and the file carries 31 separate mutableStateOf declarations (SideToolbar has another 25). That many independent remembered values in one scope makes recomposition scope hard to reason about and the composable untestable. Introduce an EditorUiState holder class (remembered once) grouping the related flags — dialog visibility, active tool, popup open-state, pending insert placement — and break the 400-line composable into named sub-composables per region. Reduces recomposition churn and brings the function under the ~100-line guideline."
status = "active"
category = "refactor"
urgency = "normal"
order = 30
created = 2026-08-03
tags = ["compose", "state"]
rebuild = true
emulator_debug = false

[[task]]
id = "unify-the-ink-and-pdf-bitmap-caches-under-one-memory-budget"
title = "Unify the ink and PDF bitmap caches under one memory budget"
description = "There are two independent bitmap caches with unrelated eviction policies and separate budgets: InkCache (render/InkCache.kt) uses a plain HashMap keyed by page index, evicting only via retain(keep) on viewport change with a per-entry BUDGET_PX ceiling, while PdfPageCache (render/PdfPageCache.kt:57) uses an access-ordered LinkedHashMap LRU with its own byte budget. On a PDF-backed document both fill simultaneously and neither knows the other's footprint, so total bitmap memory is the sum of two guesses rather than one bound. Extract a shared BitmapBudget (bytes accounted centrally, LRU eviction, recycle on evict) that both caches allocate through, sized from the app's actual heap via ActivityManager.memoryClass instead of hard-coded constants."
status = "active"
category = "refactor"
urgency = "normal"
order = 40
created = 2026-08-03
tags = ["memory", "performance"]
rebuild = true
emulator_debug = false

