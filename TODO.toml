[[task]]
id = "elementrenderer-bitmap-budget"
title = "ElementRenderer: bound and recycle the decoded-image bitmap cache"
description = "render/ElementRenderer.kt (~lines 80-82): bitmaps decoded from embedded image bytes are cached forever and never recycled, unlike render/InkCache.kt (BitmapBudget registration ~line 81, recycle on eviction ~line 131) and render/ImageBackgroundCache.kt (~lines 122/128) — a document with many embedded images grows the heap without bound. Fix: register the cache as a BitmapBudget.Client and evict plus recycle LRU-style, mirroring InkCache. While in the file, add Log.w to the two silent catch blocks at ~lines 92 and 100 (a LaTeX element that never renders is currently undiagnosable), matching the style of ImageBackgroundCache.give (~135-139). Depends on elementrenderer-identity-cache-keys landing first. Full scripts/build.sh."
