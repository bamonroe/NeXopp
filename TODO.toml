[[task]]
id = "lasso-confirm-the-shaded-region-matches-the-polygon-that-is-tested"
title = "Lasso: confirm the shaded region matches the polygon that is tested"
description = "The lasso path is captured in view px in SelectionGestureController.lassoPts and converted to page-local pt only at ACTION_UP (SelectionGestureController.kt:288). The shaded region drawn on screen comes from the same point list, but nothing verifies the two agree once the page is scrolled or zoomed mid-gesture, and the drawn path's implicit closing segment must match the closing segment the even-odd test in SelectionTester.contains assumes. Verify both, and fix any mismatch so what the user sees shaded is exactly what gets selected."
