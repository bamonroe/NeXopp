[[task]]
id = "wire-text-import-through-documentio-and-cache-the-generated-pdf"
title = "Wire text import through DocumentIo and cache the generated PDF"
description = "Join the pieces so a text file opens exactly like a PDF-backed document. In io/DocumentIo.read() (line 94) add a FileKind.TEXT branch next to the PDF short-circuit at line 96 that generates the PDF and returns LoadedFile.Pdf(generated) - MainActivity.loadDocument then needs no change, and Background.Pdf, PdfImport and PdfTextExtractor selection all fall out for free. Cache via the existing io/PdfStore.kt: add a small manifest keyed by a content hash of the source text plus title so reopening the same file while its cache entry survives reuses the PDF instead of regenerating; liveness pruning already drops it when the tab closes. On save to .xopp the generated PDF has no on-disk source, so it must be attached through the ZIPPED/attach encode path in DocumentIo. Cover the round-trip with a test: open text -> annotate -> save -> reopen."
