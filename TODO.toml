# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "lay-out-markdown-blocks-into-pages-with-block-styling"
title = "Lay out markdown blocks into pages with block styling"
description = "Compose parsed blocks into pages: per-heading-level font size and weight, space-before/space-after between blocks, list indentation with bullet or number markers, block-quote indent (and a rule if wanted), horizontal rules, and code blocks set in monospace at a fixed size with their own indent. Owns page breaking - a block spans pages, and a heading should not be orphaned at the page foot. Extends the PageSpec idea into a markdown style spec so sizes live in one place. Pure Kotlin over the styled wrapper; unit-tested for block spacing, indent arithmetic, and page-break behaviour."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 150
created = 2026-08-04
tags = ["markdown"]
rebuild = false
emulator_debug = false

[[task]]
id = "emit-styled-markdown-runs-to-pdf"
title = "Emit styled markdown runs to PDF"
description = "Extend the PDF emitter so a laid-out line can draw several runs at different x offsets in different fonts. Requires PdfFonts to embed the bold/italic/bold-italic DejaVu faces alongside the existing Sans and Sans Mono (add the TTFs to app/src/main/assets/fonts plus the LICENSE note), load them per document with the same per-doc cache, and expose a measurer per face so wrap widths match drawn widths exactly. Also draw horizontal rules as filled rects. Verify end-to-end with a round-trip test that extracts the text back out of a generated markdown PDF, and update README.md and docs/architecture.md in the same commit."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 160
created = 2026-08-04
tags = ["markdown", "pdf"]
rebuild = true
emulator_debug = true

