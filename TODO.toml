title = "Raise the text import cap now that typesetting is bounded"
description = "Once the import path is streaming end to end, the hard cap in TextImport.pdfFor exists only to bound output size and time, not memory. Re-measure peak memory on a large file, then raise AppSettings.TEXT_IMPORT_LIMIT_CHOICES / DEFAULT_TEXT_IMPORT_LIMIT_MB (AppSettings.kt:177,183) to the new safe ceiling and update the Storage section copy in README.md accordingly. Depends on the three streaming tasks."
status = "active"
