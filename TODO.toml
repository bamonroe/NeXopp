# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "break-sidetoolbar-kt-into-per-section-files"
title = "Break SideToolbar.kt into per-section files"
description = "SideToolbar.kt is 1303 lines holding the toolbar shell plus every popup it can open; the SideToolbar composable itself is ~117 lines and PagesPopupButton ~102, both over the ~100-line guideline. Split along the popup boundaries (pages popup, layers popup, tool option groups, colour entry) into sibling files in ui/, mirroring how SettingsScreen/SettingsSections is already split. Pure code motion — no behaviour change."
status = "active"
category = "refactor"
urgency = "low"
order = 50
created = 2026-08-03
tags = ["mono-file", "ui"]
rebuild = true
emulator_debug = false

[[task]]
id = "move-file-staging-and-pdf-plumbing-out-of-mainactivity"
title = "Move file-staging and PDF plumbing out of MainActivity"
description = "MainActivity.kt is 866 lines and mixes Android lifecycle/intent handling with document I/O policy: it owns UriStaging, two PdfStore instances (cache-backed and filesDir-backed), the merged-background-PDF join path, and the per-pane TabStore wiring. Extract a DocumentIoCoordinator (or similar) that owns staging, the two PDF stores, and the open/save/merge flows, leaving MainActivity as intent plumbing plus Compose host. This also makes the open/save paths unit-testable off-device."
status = "active"
category = "refactor"
urgency = "low"
order = 60
created = 2026-08-03
tags = ["mono-file"]
rebuild = true
emulator_debug = false

[[task]]
