# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "pdf-import-with-replace-or-append-choice"
title = "PDF import with Replace or Append choice"
description = "When importing a PDF into an already-open document, prompt for one of two modes: Replace (the imported PDF becomes the document's page backgrounds, discarding/overwriting the current ones) or Append (the PDF's pages are appended as new pages after the existing pages of the current document). Both must save back to .xopp so the PDF background reference round-trips to desktop Xournal++."
status = "active"
category = "feature"
urgency = "high"
order = 20
created = 2026-08-02
tags = ["pdf", "import"]
rebuild = true
emulator_debug = false

[[task]]
id = "page-overview-grid-view-for-page-management"
title = "Page overview / grid view for page management"
description = "A page-level view that zooms out from the single-page editor: split the view to show two or three pages side by side, or zoom further out to a grid of many page thumbnails. This is the umbrella feature that page reordering, deletion, and copy/paste hang off of."
status = "active"
category = "feature"
urgency = "normal"
order = 30
created = 2026-08-02
tags = ["ui", "pages"]
rebuild = true
emulator_debug = true

