[[task]]
id = "bezier-tool-can-t-be-ended-and-previews-the-curve-poorly"
title = "Bezier tool can't be ended and previews the curve poorly"
description = "Two problems with the bezier/spline line tool: (1) there is no way to stop adding new spline points — the user can't finish or commit the curve; (2) the live preview is a poor indicator of where the curve will actually be drawn, especially once the third point is added. Add a clear way to end the spline (e.g. double-tap/confirm) and improve the in-progress preview so the drawn result matches what is shown."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 40
created = 2026-08-10
tags = []
rebuild = true
emulator_debug = true

[[task]]
id = "lasso-don-t-select-unmodelled-rawelements-at-the-page-origin"
title = "Lasso: don't select unmodelled RawElements at the page origin"
description = "ElementBounds.of gives RawElement an empty box at (0,0,0,0) (app/src/main/java/com/nexopp/render/ElementBounds.kt:80). That is meant to keep it out of every hit test, but inPolygon/inRect treat the degenerate box as a real one, so any lasso or rubber-band drawn over the top-left corner of the page wholly encloses it and selects every unmodelled element. Make the hit tests skip elements with no trustworthy geometry explicitly rather than relying on the empty box, and cover it with a unit test."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 60
created = 2026-08-10
tags = []
rebuild = true
emulator_debug = false

[[task]]
id = "lasso-give-thin-strokes-and-text-the-same-tap-padding-as-a-tap-pick"
title = "Lasso: give thin strokes and text the same tap padding as a tap pick"
description = "pickTopmost expands bounds by ElementBounds.TAP_PAD before hit-testing, but inPolygon/inRect do not. A hairline stroke or an empty text box traced closely by the lasso can fall just outside the polygon and be missed even though the user clearly enclosed it. Decide the rule (likely: no pad for containment, but tolerate points within TAP_PAD of the polygon edge) and apply it consistently across the containment tests, with unit tests."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 70
created = 2026-08-10
tags = []
rebuild = true
emulator_debug = false

[[task]]
id = "lasso-confirm-the-shaded-region-matches-the-polygon-that-is-tested"
title = "Lasso: confirm the shaded region matches the polygon that is tested"
description = "The lasso path is captured in view px in SelectionGestureController.lassoPts and converted to page-local pt only at ACTION_UP (SelectionGestureController.kt:288). The shaded region drawn on screen comes from the same point list, but nothing verifies the two agree once the page is scrolled or zoomed mid-gesture, and the drawn path's implicit closing segment must match the closing segment the even-odd test in SelectionTester.contains assumes. Verify both, and fix any mismatch so what the user sees shaded is exactly what gets selected."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 80
created = 2026-08-10
tags = []
rebuild = true
emulator_debug = true

[[task]]
id = "lasso-decide-whether-selection-should-be-limited-to-the-active-layer"
title = "Lasso: decide whether selection should be limited to the active layer"
description = "inPolygon and inRect sweep every layer on the page, so a lasso can pick up objects on layers the user is not editing. Desktop Xournal++ selects within the current layer. Check the desktop behaviour, then make NeXopp match it (probably: restrict both containment queries to the active layer), and cover the choice with a unit test."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 90
