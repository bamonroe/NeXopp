# TODO — active task list for xopp_android.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work unchecked."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `todo.py done <id>` to move it to FINISHED.toml."
documentation_is_part_of_the_task = "Every task that writes code also writes its documentation, in the same task and the same commit. Never add a separate follow-up task for documenting work that a task already did — a task whose docs are not updated is not finished, and no `done` until they are."
scope = "Only build features the .xopp format can represent on disk. If a capability cannot round-trip through the file, it is out of scope."

[[task]]
id = "background-select-offer-explicit-copy-and-cut-alongside-paste"
title = "Background select: offer explicit Copy and Cut alongside Paste"
description = "The BG_SELECT/SELECT/LASSO action bar (SelectModeBar, app/src/main/java/com/nexopp/ui/EditorActionBars.kt:125) renders exactly one button, Paste. Region select silently copies the flattened region to the element clipboard on release (BackgroundSelection.kt:74 commitBackgroundSelect), so the user never sees a Copy action and cannot re-copy or cut. Add distinct Copy and Cut buttons: Copy re-captures the current marquee region into the clipboard, Cut does that and erases the covered region. Keep the bar composing to nothing when there is nothing to act on. Update README.md and docs/architecture.md in the same commit."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 100
created = 2026-08-10
tags = []
rebuild = true
emulator_debug = true

[[task]]
id = "paste-should-leave-the-pasted-content-as-the-active-editable-selection"
title = "Paste should leave the pasted content as the active, editable selection"
description = "pasteOnto (app/src/main/java/com/nexopp/render/DrawingSurfaceSelection.kt:103) sets ActiveSelection and fires onSelectionChanged(true), but if the active tool is BG_SELECT the gesture layer never reaches SelectionGestureController (DrawingSurfaceInput.kt:221 activeTool()), so the pasted elements draw as selected yet cannot be dragged, resized or rotated — and the next touch starts a new marquee, which calls gestures.clearSelection() (BackgroundSelection.kt:22) and destroys the selection outright. On paste, switch the tool to EditorTool.SELECT so the pasted item is immediately manipulable. Either add a surface->chrome tool-change callback next to onSelectionChanged (DrawingSurfaceView.kt:418) or set ui.tool/applyTool at the onPaste lambda (EditorOverlays.kt:130). Update README.md and docs/architecture.md in the same commit."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 110
created = 2026-08-10
tags = []
rebuild = true
emulator_debug = true

[[task]]
id = "warn-or-confirm-before-a-region-copy-overwrites-the-element-clipboard"
title = "Warn or confirm before a region copy overwrites the element clipboard"
description = "Committing a background/region marquee overwrites the shared element clipboard with no feedback (BackgroundSelection.kt:74). Once explicit Copy/Cut exist, decide the interaction: either only write the clipboard on an explicit Copy/Cut, or surface a brief confirmation that the region was copied. Depends on the explicit Copy/Cut task. Update the owning docs in the same commit."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 120
created = 2026-08-10
tags = []
rebuild = true
emulator_debug = false
